# Analysis method register (AMR program, wave 1).
# Transcribed from the owner's research document. The four linked tables
# share method ids 01-30. Descriptive axes are verbatim guidance; the
# selector never scores them. Routing axes (analysis-routing program,
# wave 1) ride on each row and validate against the vocabularies in
# corpus_kb.analysis.method_register_routing. This file and
# src/corpus_kb/config/analysis_methods.yaml must stay byte-identical.
register_version: "3.0.0"
source_document:
  title: "I want to understand the NLP Analysis landscape so that I can ensure a team of non-NLP researchers are selected methods appropriately when using an NLP harness around a claude code like tool"
  path_note: "Owner research document with 30 methods and four linked tables that share ids 01-30. Per-method sources are the document footnotes."
selection_rules:
  - "Match the required output."
  - "Prefer direct, inspectable evidence over inferred constructs."
  - "Prefer the method that needs fewer unverified assumptions."
  - "Use a more complex method only after the simpler baseline fails a defined evaluation."
adjacent_candidates: "Top2Vec, KeyLLM, and MMR appear only in the source footnotes. They have no register rows and no ops."
methods:
  - id: "01"
    name: "Full manual codebook analysis (baseline)"
    summary: "Researchers define, test, revise, and apply codes. Human analysis is the reference for interpretive claims."
    paradigm: "human_led"
    evidence_label: "human_judgment"
    inputs_required: ["raw_text"]
    calibration_effort: "high"
    autonomy: "human_led"
    complexity_tier: "advanced"
    selection_priority: "first"
    selection_notes: "First for interpretive questions that need a full codebook. Do not use it for routine bounded tasks."
    robustness_caveat: "Coding procedures can drift as analysts meet new cases."
    bias_risk: "Researcher expectations, selective attention, and premature code closure can shape the result."
    efficiency_workload: "Compute is minor. Human reading and coding dominate the workload."
    output_family: "themes"
    output_shape: "Coded source spans, codebook versions, analytical notes, and case comparisons."
    usage_guidance: "Use it to support detailed interpretation and an auditable record of code application."
    validation_required: "Check code application and analytical adequacy under the chosen approach. Human analysis is not error-free."
    permitted_claims: "Interpreted claims, with the codebook version and analyst decisions recorded."
    do_not_claim: "Do not claim human coding is an error-free reference standard."
    implementation_status: "human_led"
    op: null
    sources:
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC11877799/ (Journal 2025)"
      - "https://shura.shu.ac.uk/30222/9/Swallow-APragmaticGuideToQualitative(AM).pdf"
    task_type: "representation"
    comparison_structure: "none"
    output_form: "narrative"
    evidence_basis: "labels"
    statistical_rigor: "descriptive"
    cost_tier: "batch"
    question_phrases:
      - "How do I build a codebook for my interview study?"
      - "Can researchers hand code these transcripts step by step?"
      - "I want to define and apply my own codes carefully."
      - "Which method gives a full manual qualitative analysis?"
      - "Help me code these documents by hand with a scheme."
      - "What is the baseline way to code text as a human?"
    failure_modes: "Selective attention and premature code closure can hide cases that do not fit."
    scope_limits: "Manual close reading wins for interpretive claims."
    suggests:
      - "Which cases resist my current codes?"
      - "How do I record code changes over time?"
      - "Where do two codes overlap in one passage?"
  - id: "02"
    name: "Rapid Qualitative Analysis (RQA) matrix"
    summary: "Analysts place short summaries in a structured template, then compare cases in a matrix."
    paradigm: "human_led"
    evidence_label: "human_judgment"
    inputs_required: ["raw_text"]
    calibration_effort: "moderate"
    autonomy: "human_in_loop"
    complexity_tier: "baseline"
    selection_priority: "first"
    selection_notes: "First for question-by-case comparison of interview material."
    robustness_caveat: "Summary templates can omit detail that later analysis needs."
    bias_risk: "Template and interview-guide framing can compress the summaries."
    efficiency_workload: "Compute is minor. Human summarization and comparison dominate the workload."
    output_family: "structures"
    output_shape: "Rows for cases, columns for questions, short summaries, and source links."
    usage_guidance: "Answer a bounded set of questions. Read the original evidence before consequential decisions."
    validation_required: "Pilot the template. Have another analyst inspect the summaries. Revise missing or ambiguous fields."
    permitted_claims: "Bounded answers for the templated questions, with links to evidence."
    do_not_claim: "Do not claim the matrix equals a full line-by-line analysis."
    implementation_status: "implemented_existing"
    op: "analyze_run"
    sources:
      - "https://pmc.ncbi.nlm.nih.gov/articles/PMC11877799/ (Journal 2025)"
      - "https://shura.shu.ac.uk/30222/9/Swallow-APragmaticGuideToQualitative(AM).pdf"
    task_type: "measurement"
    comparison_structure: "subset_vs_subset"
    output_form: "point_answer"
    evidence_basis: "claims"
    statistical_rigor: "descriptive"
    cost_tier: "interactive"
    question_phrases:
      - "How do I compare interview cases on a fixed question set?"
      - "Show answers per case in a simple matrix view."
      - "Can I summarize each case against my study questions?"
      - "I need a rapid comparison grid across interviewees."
      - "Which method compares cases quickly using short summaries?"
      - "Put each participant's answers side by side in a table."
    failure_modes: "Template framing can compress answers and hide detail later analysis needs."
    scope_limits: "Answers stay bounded; read the original evidence before big decisions."
    suggests:
      - "Which cases disagree on this question?"
      - "Is the template missing an answer type?"
      - "Where do summaries need the original quote?"
  - id: "03"
    name: "Framework Method"
    summary: "Analysts chart coded evidence in a case-by-category matrix to compare within and across cases."
    paradigm: "human_led"
    evidence_label: "human_judgment"
    inputs_required: ["raw_text"]
    calibration_effort: "high"
    autonomy: "human_in_loop"
    complexity_tier: "advanced"
    selection_priority: "next"
    selection_notes: "Next when case comparison needs deeper structure than the RQA matrix."
    robustness_caveat: "Matrix reduction can weaken narrative and sequence information when categories shift while charting or uncategorized material drops from view."
    bias_risk: "Fixed framework categories can make uncategorized material less visible."
    efficiency_workload: "Compute is minor. Charting and interpretation dominate the workload."
    output_family: "structures"
    output_shape: "A case-by-category matrix with condensed evidence and source references."
    usage_guidance: "Compare cases, groups, or conditions. Keep access to the case context."
    validation_required: "Set categories and charting rules. Check a pilot matrix against the source material."
    permitted_claims: "Case comparisons that preserve cited context."
    do_not_claim: "Do not claim the charting preserved every narrative detail."
    implementation_status: "implemented_existing"
    op: "analyze_run"
    sources:
      - "https://doi.org/10.1186/1471-2288-13-117 (Journal 2013)"
      - "https://shura.shu.ac.uk/30222/9/Swallow-APragmaticGuideToQualitative(AM).pdf"
    task_type: "measurement"
    comparison_structure: "subset_vs_subset"
    output_form: "narrative"
    evidence_basis: "labels"
    statistical_rigor: "descriptive"
    cost_tier: "batch"
    question_phrases:
      - "How do I chart coded evidence case by case?"
      - "I need a case by category matrix of my findings."
      - "Compare groups of participants across framework categories."
      - "Which method structures qualitative evidence for cross case comparison?"
      - "Help me build a framework matrix from my coded data."
      - "Where can I see categories as columns and cases as rows?"
    failure_modes: "Matrix reduction can weaken narrative and sequence information."
    scope_limits: "Deep interpretation beats the matrix when narrative sequence matters."
    suggests:
      - "Which categories split the cases most cleanly?"
      - "What sits outside the framework columns?"
      - "How do two case groups compare on each category?"
  - id: "04"
    name: "Dictionary or rule-based classification"
    summary: "Match defined words, phrases, or patterns to categories. Rules can assign a category or abstain."
    paradigm: "supervised"
    evidence_label: "direct"
    inputs_required: ["raw_text"]
    calibration_effort: "low"
    autonomy: "automated_with_audit"
    complexity_tier: "baseline"
    selection_priority: "first"
    selection_notes: "First for explicit mentions of a known issue. Check the non-matches too."
    robustness_caveat: "Matches are sensitive to synonyms, negation, spelling, and context."
    bias_risk: "Vocabulary choices can favor some groups or ways of speaking."
    efficiency_workload: "Text scanning only. No neural inference is required. One text scan over n records; fast at corpus scale."
    output_family: "labels"
    output_shape: "Matched spans, rule ids, category assignments, exclusions, and unmatched records."
    usage_guidance: "Find explicit mentions and build a review queue."
    validation_required: "Inspect matches and non-matches. Add exclusions. Test the rules on independent records."
    permitted_claims: "Counts of rule matches, unless broader validity is established."
    do_not_claim: "Do not claim rule matches prove implicit meaning."
    implementation_status: "implemented_existing"
    op: "labeling_build"
    sources:
      - "https://docs.v1.argilla.io/en/v1.10.0/reference/webapp/features.html (Documentation)"
      - "https://link.springer.com/content/pdf/10.1007/s00778-019-00552-1.pdf"
    task_type: "measurement"
    comparison_structure: "none"
    output_form: "point_answer"
    evidence_basis: "lexical"
    statistical_rigor: "descriptive"
    cost_tier: "interactive"
    question_phrases:
      - "Find every mention of these specific words or phrases."
      - "Can simple rules label records that name this issue?"
      - "I want pattern matching for known terms in the text."
      - "Which method counts explicit mentions using my keyword list?"
      - "Match records against a dictionary of defined terms."
      - "Show me where my search patterns appear in records."
    failure_modes: "Negation and context flip matches; counts never prove implicit meaning."
    scope_limits: "Rule matches find explicit mentions; implicit meaning needs reading or models."
    suggests:
      - "Which rules over-match or under-match?"
      - "What do the unmatched records say?"
      - "Should an exclusion cover negated phrases?"
  - id: "05"
    name: "TF-IDF keyphrase scan"
    summary: "Rank words and word sequences by document frequency and corpus rarity to find distinctive wording."
    paradigm: "unsupervised"
    evidence_label: "direct"
    inputs_required: ["raw_text"]
    calibration_effort: "low"
    autonomy: "automated_with_audit"
    complexity_tier: "baseline"
    selection_priority: "first"
    selection_notes: "First to understand the main vocabulary. YAKE (07) is the low-setup peer."
    robustness_caveat: "Sensitive to document boundaries, vocabulary filtering, and repeated boilerplate."
    bias_risk: "Rare wording can rank highly without research importance."
    efficiency_workload: "Sparse text-matrix construction and ranking over n text units. CPU-oriented."
    output_family: "themes"
    output_shape: "Ranked terms and phrases with TF-IDF weights and document links."
    usage_guidance: "Inspect corpus vocabulary, find search terms, and improve retrieval."
    validation_required: "Review tokenization, common words, phrase lengths, and the top-ranked terms."
    permitted_claims: "Descriptions of distinctive wording in the corpus."
    do_not_claim: "Do not call the ranked list themes."
    implementation_status: "implemented_new"
    op: "keyphrases_extract"
    sources:
      - "https://scikit-learn.org/1.5/modules/generated/sklearn.feature_extraction.text.TfidfVectorizer.html (Documentation)"
      - "https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.TfidfTransformer.html"
    task_type: "discovery"
    comparison_structure: "none"
    output_form: "ranked_list"
    evidence_basis: "lexical"
    statistical_rigor: "descriptive"
    cost_tier: "interactive"
    question_phrases:
      - "What words come up most often across these documents?"
      - "Which terms stand out as unusual in this corpus?"
      - "Show the most distinctive wording in the collection."
      - "I want a ranked list of important words."
      - "Which vocabulary dominates the text in these records?"
      - "Help me find frequent phrases to improve search."
    failure_modes: "Repeated boilerplate and rare words can outrank meaningful terms."
    scope_limits: "Distinctive wording only; themes need reading or topic models."
    suggests:
      - "Which top terms look meaningless here?"
      - "What rare words rank surprisingly high?"
      - "How does filtering change the ranked list?"
  - id: "06"
    name: "Embedding-based keyphrase extraction (KeyBERT)"
    summary: "Rank candidate phrases by embedding similarity to the document. Seed terms can steer the ranking."
    paradigm: "unsupervised"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "embeddings"]
    calibration_effort: "moderate"
    autonomy: "automated_with_audit"
    complexity_tier: "standard"
    selection_priority: "next"
    selection_notes: "Next for document previews and candidate descriptors when embeddings exist."
    robustness_caveat: "Sensitive to the embedding model, candidate generation, and document length."
    bias_risk: "The representation can favor language covered in model training."
    efficiency_workload: "One encoding pass for documents and candidate phrases. Caching cuts repeat work."
    output_family: "themes"
    output_shape: "Ranked phrases with similarity scores and source documents."
    usage_guidance: "Create document previews, search suggestions, and candidate descriptors."
    validation_required: "Review candidate generation, model choice, diversity settings, and an output sample."
    permitted_claims: "Phrases similar in meaning to the document, by embedding similarity."
    do_not_claim: "Do not read similarity scores as probabilities of analytical importance."
    implementation_status: "implemented_new"
    op: "keyphrases_extract"
    sources:
      - "https://maartengr.github.io/KeyBERT/guides/embeddings.html (Documentation)"
      - "https://maartengr.github.io/KeyBERT/guides/quickstart.html"
    task_type: "discovery"
    comparison_structure: "none"
    output_form: "ranked_list"
    evidence_basis: "vector"
    statistical_rigor: "descriptive"
    cost_tier: "interactive"
    question_phrases:
      - "Which phrases best describe what each document says?"
      - "Suggest key phrases for a summary preview of documents."
      - "Find candidate phrases similar in meaning to the document."
      - "I want embedding based keywords for each record."
      - "Which phrases represent this document's main content?"
      - "Help me pick descriptor phrases guided by seed terms."
    failure_modes: "Model favoritism can rank trained-on language; scores are not importance."
    scope_limits: "Phrase previews only; not validated themes or importance ranking."
    suggests:
      - "Do these phrases match what the document argues?"
      - "How does a seed term change the ranking?"
      - "Which documents share the same key phrases?"
  - id: "07"
    name: "Statistical keyphrase extraction (YAKE)"
    summary: "Extract phrases from text features alone. No fitted model or embedding step is needed."
    paradigm: "unsupervised"
    evidence_label: "direct"
    inputs_required: ["raw_text"]
    calibration_effort: "low"
    autonomy: "automated_with_audit"
    complexity_tier: "baseline"
    selection_priority: "first"
    selection_notes: "First for a low-setup lexical overview. Compare it with 06."
    robustness_caveat: "Salience rests on text features and matching language settings; short texts and filtering choices can change the results."
    bias_risk: "Surface salience can miss implicit or uncommon concepts."
    efficiency_workload: "Local statistical text processing over n text units. No transformer is required."
    output_family: "themes"
    output_shape: "Ranked phrases with algorithm scores."
    usage_guidance: "Get a quick lexical overview and compare it with embedding-based extraction."
    validation_required: "Review language and filtering settings. Inspect short and long texts separately."
    permitted_claims: "Statistically salient phrases for the supplied texts."
    do_not_claim: "Do not claim research importance for high-scoring phrases."
    implementation_status: "implemented_new"
    op: "keyphrases_extract"
    sources:
      - "https://doi.org/10.1016/j.ins.2019.09.013 (Journal 2019)"
      - "https://aclanthology.org/2022.findings-acl.34.pdf"
    task_type: "discovery"
    comparison_structure: "none"
    output_form: "ranked_list"
    evidence_basis: "lexical"
    statistical_rigor: "descriptive"
    cost_tier: "interactive"
    question_phrases:
      - "Give me a quick phrase list without any model."
      - "Extract salient phrases using text statistics alone."
      - "What are the top phrases by statistical salience?"
      - "I need keywords fast with no embeddings or training."
      - "Which phrases score high on simple word statistics?"
      - "Show key phrases computed from the text features only."
    failure_modes: "Short texts and filtering choices can change the ranked phrases."
    scope_limits: "Statistically salient phrases only; not research importance."
    suggests:
      - "How does this list compare with embedding-based phrases?"
      - "Which phrases survive stricter filtering?"
      - "Do short texts rank differently here?"
  - id: "08"
    name: "Classical topic modeling (NMF or LDA)"
    summary: "Factor the document-term matrix or model documents as topic mixtures for exploratory navigation."
    paradigm: "unsupervised"
    evidence_label: "model_based"
    inputs_required: ["raw_text"]
    calibration_effort: "moderate"
    autonomy: "automated_with_audit"
    complexity_tier: "standard"
    selection_priority: "avoid_first"
    selection_notes: "Do not start here for vocabulary needs. 05 and 07 answer those with less setup."
    robustness_caveat: "Topic results change with preprocessing, topic count, fitting choices, and wording drift."
    bias_risk: "Frequent vocabulary and analyst-selected topic counts shape the results."
    efficiency_workload: "Repeated fitting on sparse matrices over n documents. No transformer is required."
    output_family: "themes"
    output_shape: "Topic-word lists, document-topic weights, and representative documents."
    usage_guidance: "Navigate a corpus and form questions for close reading."
    validation_required: "Compare preprocessing and topic counts. Inspect representative and poorly fitting records."
    permitted_claims: "Exploratory topic descriptions for navigation."
    do_not_claim: "Do not read a topic weight as proof of a qualitative theme."
    implementation_status: "not_planned"
    op: null
    sources:
      - "https://www.jmlr.org/papers/v3/blei03a.html (Journal 2003)"
      - "https://scikit-learn.org/stable/modules/decomposition.html"
    task_type: "discovery"
    comparison_structure: "none"
    output_form: "ranked_list"
    evidence_basis: "lexical"
    statistical_rigor: "descriptive"
    cost_tier: "batch"
    question_phrases:
      - "What topics run through this whole corpus?"
      - "Show topic word lists to explore the collection."
      - "I want to navigate themes across many documents."
      - "Which topic mixtures describe each document?"
      - "Help me explore recurring subjects with topic modeling."
      - "Group vocabulary into exploratory topics for browsing."
    failure_modes: "Frequent vocabulary and analyst-chosen topic counts shape every result."
    scope_limits: "Exploratory navigation only; never proof of a qualitative theme."
    suggests:
      - "How many topics fit this corpus best?"
      - "Which documents mix topics strongly?"
      - "What wording sits outside every topic?"
  - id: "09"
    name: "Unsupervised BERTopic"
    summary: "Embed text, group similar representations, and describe each group with class-based TF-IDF terms."
    paradigm: "unsupervised"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "embeddings"]
    calibration_effort: "moderate"
    autonomy: "automated_with_audit"
    complexity_tier: "standard"
    selection_priority: "next"
    selection_notes: "Next for groups that need topic descriptors. Not a substitute for question-by-case evidence."
    robustness_caveat: "Clusters depend on embeddings, dimensionality reduction, and clustering settings."
    bias_risk: "Small or dispersed groups can be treated as outliers."
    efficiency_workload: "One embedding pass over n text units plus CPU grouping. Repeated model searches add cost."
    output_family: "themes"
    output_shape: "Cluster ids, topic terms, representative records, and outlier records."
    usage_guidance: "Build an exploratory corpus map and sample records for inspection."
    validation_required: "Review segmentation and clustering settings. Inspect clusters and outliers. Repeat with controlled changes."
    permitted_claims: "Exploratory corpus maps with cluster descriptions."
    do_not_claim: "Do not present a topic representation as a validated research theme."
    implementation_status: "implemented_existing"
    op: "topics_build"
    sources:
      - "https://arxiv.org/abs/2203.05794 (Preprint 2022)"
      - "https://elearning.unimib.it/pluginfile.php/2037266/mod_resource/content/1/2203.05794v1.pdf"
      - "https://maartengr.github.io/BERTopic/algorithm/algorithm.html"
    task_type: "discovery"
    comparison_structure: "none"
    output_form: "cluster_map"
    evidence_basis: "vector"
    statistical_rigor: "descriptive"
    cost_tier: "batch"
    question_phrases:
      - "Discover topics from embeddings and describe each group."
      - "What clusters of discussion appear in these records?"
      - "Build an exploratory topic map of the corpus."
      - "Which records belong to each discovered topic?"
      - "I want topic terms with representative example records."
      - "Help me map recurring themes and spot outliers."
    failure_modes: "Small or dispersed groups can be discarded as outliers."
    scope_limits: "Exploratory maps only; not validated research themes."
    suggests:
      - "Which clusters look like real topics?"
      - "What did the model treat as outliers?"
      - "How stable are topics across settings?"
  - id: "10"
    name: "Guided BERTopic"
    summary: "Seed words steer topic formation toward topics of interest. Records are not forced onto a label list."
    paradigm: "weak_supervision"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "embeddings", "seed_labels"]
    calibration_effort: "moderate"
    autonomy: "human_in_loop"
    complexity_tier: "standard"
    selection_priority: "next"
    selection_notes: "Next when known concepts should shape exploration. Compare with an unguided run."
    robustness_caveat: "Seed words must point at real concepts; seeds do not guarantee the wanted topics or complete discovery."
    bias_risk: "Supplied topic vocabulary can create confirmation bias."
    efficiency_workload: "BERTopic workload over n text units plus seed representations and comparisons."
    output_family: "themes"
    output_shape: "Seed-influenced topics with assigned records and representative text."
    usage_guidance: "Explore expected subject areas while checking material outside them."
    validation_required: "Review seed coverage and alternatives. Compare against an unguided run."
    permitted_claims: "Topics shaped by declared seed concepts."
    do_not_claim: "Do not claim the seeds produced complete or unbiased discovery."
    implementation_status: "implemented_new"
    op: "topics_build"
    sources:
      - "https://maartengr.github.io/BERTopic/getting_started/guided/guided.html (Documentation)"
      - "https://maartengr.github.io/BERTopic/algorithm/algorithm.html"
    task_type: "discovery"
    comparison_structure: "none"
    output_form: "cluster_map"
    evidence_basis: "vector"
    statistical_rigor: "descriptive"
    cost_tier: "batch"
    question_phrases:
      - "Steer topic discovery toward my known subject areas."
      - "Can seed words focus the topics on my interests?"
      - "I want topics shaped by the concepts I supply."
      - "Guide the exploration using my list of expected themes."
      - "Which topics formed around my seed vocabulary?"
      - "Help me confirm expected themes while finding the rest."
    failure_modes: "Seed vocabulary can create confirmation bias and incomplete discovery."
    scope_limits: "Seed-shaped exploration only; not complete or unbiased discovery."
    suggests:
      - "How does the guided run differ from the unguided one?"
      - "Which seeds failed to shape a topic?"
      - "What topics formed outside my seeds?"
  - id: "11"
    name: "Zero-shot BERTopic"
    summary: "Match records to supplied topic descriptions by similarity, then discover topics in the remaining records."
    paradigm: "zero_shot"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "embeddings", "labels"]
    calibration_effort: "moderate"
    autonomy: "human_in_loop"
    complexity_tier: "standard"
    selection_priority: "next"
    selection_notes: "Next when a fixed topic list must route records first. Test the similarity threshold."
    robustness_caveat: "Description wording and thresholds affect assignment versus discovery."
    bias_risk: "Familiar topics can absorb material that merits a different reading."
    efficiency_workload: "One embedding pass over n text units, topic similarities, and grouping of the rest."
    output_family: "themes"
    output_shape: "Supplied-topic assignments, similarity scores, discovered topics, and unassigned records."
    usage_guidance: "Combine known-topic routing with an explicit route for unexpected material."
    validation_required: "Test descriptions and thresholds. Inspect assigned and unassigned text."
    permitted_claims: "Assignments to supplied topics, with the threshold recorded."
    do_not_claim: "Do not equate this similarity matching with NLI classification."
    implementation_status: "implemented_new"
    op: "topics_build"
    sources:
      - "https://maartengr.github.io/BERTopic/getting_started/zeroshot/zeroshot.html (Documentation)"
      - "https://maartengr.github.io/BERTopic/algorithm/algorithm.html"
    task_type: "measurement"
    comparison_structure: "none"
    output_form: "cluster_map"
    evidence_basis: "vector"
    statistical_rigor: "descriptive"
    cost_tier: "batch"
    question_phrases:
      - "Route records onto my fixed list of topic descriptions."
      - "Match records to supplied topics and discover the rest."
      - "I have known topic names; sort records into them."
      - "Assign documents to my topic list by similarity."
      - "Which records fit my defined topics versus new ones?"
      - "Help me split known topic records from unexpected text."
    failure_modes: "Familiar topics can absorb material that merits a different reading."
    scope_limits: "Similarity routing only; not NLI classification."
    suggests:
      - "Which records landed on no supplied topic?"
      - "What new topics formed in the rest?"
      - "How sensitive is routing to the threshold?"
  - id: "12"
    name: "Embedding clustering (including interactive clustering)"
    summary: "Group similar text representations. Human feedback can refine the groups or the representation."
    paradigm: "unsupervised"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "embeddings"]
    calibration_effort: "moderate"
    autonomy: "human_in_loop"
    complexity_tier: "standard"
    selection_priority: "first"
    selection_notes: "First for finding groups of similar comments."
