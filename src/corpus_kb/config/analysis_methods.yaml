    evidence_label: "human_judgment"
    inputs_required: ["raw_text"]
    calibration_effort: "high"
    autonomy: "human_led"
    complexity_tier: "advanced"
    selection_priority: "first"
    selection_notes: "First for developing an explanatory account with computational help."
    robustness_caveat: "Computational patterns do not remove the need for contextual interpretation."
    bias_risk: "Pattern selection and theoretical interpretation can reinforce prior beliefs."
    efficiency_workload: "Several analysis cycles over the corpus. Human work prevents a simple runtime estimate."
    output_family: "themes"
    output_shape: "Computational patterns, analytical notes, emerging explanations, and tests against evidence."
    usage_guidance: "Develop and challenge an explanation with the corpus."
    validation_required: "Test the explanation against close reading, alternative readings, and further evidence."
    permitted_claims: "An interpreted account that survived stated tests."
    do_not_claim: "Do not present it as autonomous theme discovery."
    implementation_status: "human_led"
    op: null
    sources:
