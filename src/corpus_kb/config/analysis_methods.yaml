    op: "classification_build"
    sources:
      - "https://huggingface.co/papers/2209.11055"
      - "https://huggingface.co/docs/setfit/main/en/quickstart"
  - id: "18"
    name: "Zero-shot NLI classification"
    summary: "Turn each label into a statement and score whether the text supports it. No task training is needed."
    paradigm: "zero_shot"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "llm"]
    calibration_effort: "moderate"
    autonomy: "automated_with_audit"
    complexity_tier: "standard"
    selection_priority: "first"
    selection_notes: "First for testing categories before labels exist. Run it as an evaluated pilot."
    robustness_caveat: "Wording, lexical overlap, and syntax can produce wrong support judgments."
    bias_risk: "Label descriptions and training-domain assumptions shape the results."
    efficiency_workload: "Text-label pair inference. Workload grows with record count and label count."
    output_family: "labels"
    output_shape: "Support scores per label statement, selected labels, and abstention."
    usage_guidance: "Triage records or propose labels before any labeled data exists."
    validation_required: "Test paraphrased descriptions, negation, and overlapping labels. Tune thresholds on labeled data."
    permitted_claims: "Pilot label proposals with support scores."
    do_not_claim: "Do not treat zero-shot scores as established probabilities."
    implementation_status: "implemented_new"
    op: "nli_classify"
    sources:
      - "https://aclanthology.org/D19-1404/"
      - "https://aclanthology.org/2023.eacl-main.22.pdf"
  - id: "19"
    name: "Programmatic weak supervision (Snorkel)"
    summary: "Combine imperfect labeling functions into training labels, then optionally train a classifier on them."
    paradigm: "weak_supervision"
    evidence_label: "model_based"
    inputs_required: ["raw_text", "predictions"]
    calibration_effort: "high"
    autonomy: "human_in_loop"
    complexity_tier: "advanced"
    selection_priority: "next"
    selection_notes: "Next for cutting labeling work when several reusable rules exist."
    robustness_caveat: "Correlated rules can repeat the same error. Low coverage stays a problem."
    bias_risk: "Rule authors can encode the same assumptions in several functions."
    efficiency_workload: "Rule execution over n records plus label-model fitting. Classifier training adds cost if used."
    output_family: "labels"
    output_shape: "A rule-vote matrix, coverage and conflict reports, probabilistic labels, and an optional classifier."
    usage_guidance: "Turn reusable domain rules into training data. Keep an independent human evaluation set."
    validation_required: "Inspect the labeling functions. Measure conflicts and coverage. Evaluate on independent labels."
    permitted_claims: "Training labels with coverage and conflict reports."
    do_not_claim: "Do not claim label quality without an independent evaluation set."
    implementation_status: "implemented_existing"
    op: "labeling_build"
    sources:
      - "https://link.springer.com/content/pdf/10.1007/s00778-019-00552-1.pdf"
      - "https://docs.argilla.io/latest/how_to_guides/annotate/"
  - id: "20"
    name: "Active learning loop"
    summary: "A classifier picks records for human labeling, then retrains. This allocates annotation work."
    paradigm: "supervised"
    evidence_label: "model_based"
    inputs_required: ["labels", "predictions"]
    calibration_effort: "high"
    autonomy: "human_in_loop"
    complexity_tier: "advanced"
    selection_priority: "first"
    selection_notes: "First for cutting labeling work once the task and label set are stable."
    robustness_caveat: "Uncertainty sampling can chase difficult or noisy cases, not representative ones."
    bias_risk: "Selected annotation data need not match corpus prevalence."
    efficiency_workload: "Repeated scoring and retraining over n records. Human annotation is usually the limiting resource."
    output_family: "recommendations"
    output_shape: "Next records to label, annotation history, updated models, and a learning curve."
    usage_guidance: "Reduce annotation effort for a defined task. Keep the final evaluation sample separate."
    validation_required: "Assess improvement per annotation effort. Compare against random sampling."
    permitted_claims: "Annotation-order recommendations with the strategy recorded."
    do_not_claim: "Do not claim the selection strategy always beats random sampling."
    implementation_status: "implemented_new"
    op: "active_learn_next"
    sources:
      - "https://burrsettles.com/pub/settles.activelearning.pdf"
      - "https://github.com/webis-de/small-text"
  - id: "21"
    name: "Human-in-the-loop computational grounded theory"
    summary: "Combine computational pattern detection with human interpretation and further testing of explanations."
