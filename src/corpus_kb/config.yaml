# Corpus-KB: Configuration
# Every key here has a live consumer; dead keys are removed on sight
# (zero-drift audit row 11). Environment overrides: see docs/ADMIN.md.
server:
  transport: stdio
  host: localhost
  port: 8010
  # Gates the OpenAI-compatible /v1 adapter (POST /v1/chat/completions,
  # POST /v1/embeddings, GET /v1/models).
  openai_compat: true

embedding:
  # ollama serves the 4B embedder; pgml cannot host a model of this size.
  provider: ollama
  fallback_provider: ollama
  model: qwen3-embedding:4b
  base_url: http://localhost:11434
  batch_size: 32
  # Native output width. Must equal the schema width (halfvec(2560)).
  dimensions: 2560
  # qwen3-embedding is Matryoshka-trained: front-slice truncation is sound.
  # Gates the matryoshka arm and the Ollama dimensions passthrough.
  mrl_trained: true
  # Gates QUERY_INSTRUCTION_PREFIX at instruct() (query side only).
  query_instruction: true
  # Late chunking (DOCUMENT ingest only — the G1 research choice is pooled
  # and stays pooled). Applied when the latechunk extra is installed and
  # embedding.model is a qwen3-embedding* token-level family; otherwise an
  # honest pooled fallback (embedding_note in the ingest result).
  late_chunking: true

storage:
  # chunks_vectors.embedding column type. halfvec is required at 2560 dims:
  # pgvector HNSW caps the plain vector type at 2000, halfvec at 4000.
  vector_type: halfvec

# Website (URL) ingestion (src/corpus_kb/web/). ingest_url builds its
# WebFetchConfig from this section — the shipped YAML is the live contract
# (validate_configs pins presence + types; code defaults apply only when a
# key is absent).
web:
  user_agent: "corpus-kb/0.1 (+https://github.com/moliver28/corpus-kb)"
  timeout_seconds: 30
  max_bytes: 5242880
  respect_robots: true
  max_pages: 5
  max_depth: 2
  delay_seconds: 1.0
  allow_private_addresses: false  # SSRF-guard escape hatch; true only for genuinely local targets (a local wiki)

# Pluggable ingestion strategies (src/corpus_kb/ingestion/). Resolution
# precedence: explicit --source-type override > this mapping (document
# source_type -> strategy name) > content detection > `default`.
# Third-party strategies register via the corpus_kb.ingestion_strategies
# entry-point group; every registered strategy must pass the conformance
# suite (corpus_kb.ingestion.validate_plan).
ingestion:
  # Bounded parallel file ingestion (ingest_directory / ingest_path).
  # Capped at two below the pool size; DuckDB stays serial.
  concurrency: 4
  # Token-budget chunking gate (Wave 4). 'semchunk' splits oversized text
  # on sentence/word boundaries with native char offsets via the lazy
  # [semchunk] extra (pip install 'corpus-kb[semchunk]'). Absent key = the
  # default chars/4 split; configured but not installed = the default
  # split plus a warning in the ingest result.
  # tokenizer: semchunk
  # Near-duplicate dedup gate (Wave 4). 'minhash' drops near-duplicate
  # chunks before embedding via the lazy [dedup] extra (pip install
  # 'corpus-kb[dedup]'); dropped chunk ids land in the result's
  # dedup_dropped key. Absent key = off.
  # dedup: minhash
  # Jaccard decision threshold for dedup (0 < x <= 1). LSH proposes below
  # it; the exact check decides.
  # dedup_threshold: 0.9
  strategies:
    transcript: transcript
    # Structure-aware first-class paths (default ON): decks chunk per slide
    # with title breadcrumbs + core-properties metadata; web pages chunk per
    # heading section with OG/JSON-LD metadata (source_type "web", set by
    # ingest_url).
    pptx: pptx_structure
    web: web_structure
  default: default

retrieval:
  # Only hybrid_rrf exists today; other values are rejected at load time.
  mode: hybrid_rrf
  # DuckDB vector-search mode: exact_scan (default, deterministic) or hnsw
  # (the experimental vss extension; doctor warns). Postgres keeps its
  # pgvector HNSW and ignores this key.
  vector_index: exact_scan
  # DuckDB fts-index rebuild debounce (seconds, positive). DuckDB FTS has
  # no auto-refresh; the gateway rebuilds the index on this debounce.
  fts_rebuild_debounce_s: 2.0
  # Live per-arm candidate depths before fusion (effective limit is
  # max(candidates, k * 2), so small values never under-fetch below k).
  vector_candidates: 150
  lexical_candidates: 150
  rrf_k: 60
  # Post-fusion small-to-big expansion: replace each hit with its parent
  # context. Fail-open when the shadow hierarchy has no parent row.
  expand_to_parent: true
  # Stage 3 degraded policy: when true, vector-search candidate CTEs exclude
  # rows whose stored vector is flagged degraded (all-zero backfill,
  # migration 022). Seed documents stay discoverable either way.
  exclude_degraded: true
  # Opt-in only (default false): when true, migration 023 maintains the
  # qa_context FTS expression index so transcript Q/A text is full-text
  # searchable. Off by default because Postgres ts_rank has no IDF —
  # question text in the shared index skews ranking unsoundly.
  qa_context_in_fts: false
  # U21: below this estimated selectivity, filtered queries take the exact
  # scan instead of the HNSW probe.
  exact_filter_selectivity_threshold: 0.05
  # Matryoshka two-tier retrieval: candidate fan-out is k * this multiplier.
  candidate_multiplier: 8
  self_query:
    enabled: true
    model: qwen3:4b
    base_url: http://localhost:11434
    timeout_seconds: 8
  matryoshka_enabled: false
  matryoshka_dim: 1024
  # U20: transaction-local HNSW settings (SET LOCAL inside the retrieval
  # transaction; requires pgvector >= 0.8 — older versions skip emission).
  # m/ef_construction mirror the migration-025 index DDL; doctor warns on
  # drift from the live index options.
  hnsw:
    m: 16
    ef_construction: 128
    iterative_scan: strict_order
    ef_search: 200
    max_scan_tuples: 20000

reranking:
  enabled: true
  # backend selects the scorer: null = qwen3 judgment scorer via Ollama,
  # llamacpp = true cross-encoder via POST {llamacpp_url}/v1/rerank
  # (llama-server; see docs/ADMIN.md), generative = the null alias,
  # fake = the test double.
  backend: null
  # Committed upgrade-program default: qwen3-reranker 4B. Not yet pullable
  # from the Ollama registry — until it exists locally the stage degrades
  # to the un-reranked RRF order with a logged warning.
  model: qwen3-reranker:4b
  base_url: http://localhost:11434
  # /v1/rerank endpoint for backend: llamacpp (llama-server's default port).
  llamacpp_url: http://localhost:8080
  # Rerank pre-fetch width: how many fused candidates a score-based reranker
  # may see (bounded by the arms' candidate depths).
  over_retrieve_n: 60
  candidates: 100
  # The default return k: a caller that omits k on search/query gets
  # this value (catalogue lockstep; tests/test_config_blocks.py pins it).
  return_top_k: 20
  max_pair_tokens: 768
  timeout_seconds: 120
  score_floor: 0.15
  calibration: minmax

judge:
  enabled: true
  model: qwen3:4b
  base_url: http://localhost:11434
  max_claims: 20

# Topic modeling over STORED chunk embeddings (src/corpus_kb/topics/).
# topics_build consumes the vectors ingest already wrote; it never
# re-embeds. Opt-in: the default keeps the feature dormant (bertopic is
# the [topics] extra, never a core dependency).
topics:
  enabled: false
  # Only "bertopic" is supported; other values are rejected at load.
  method: bertopic
  # LLM labels (and merges) the raw c-TF-IDF labels. A failed or missing
  # model keeps the c-TF-IDF labels and records the note.
  llm_reduction: true
  # "auto" defers to the BERTopic default (10, reported); a positive int
  # passes through.
  min_topic_size: auto
  # LLM for the reduction step (fixture-first; live_fallback gates calls).
  llm: qwen3:4b
  llm_base_url: http://localhost:11434
  fixture_dir: tests/fixtures/topics_recorded
  live_fallback: false

# Browser UI (UI SPA program Task 3, src/corpus_kb/ui/spa.py): the
# lifecycle SPA (React, built by Vite into src/corpus_kb/ui_dist/) is
# served at /app/ by the running HTTP server. Without a build the server
# logs one line and keeps the API working. The spa block is
# runtime-tunable and reaches the app via /app/runtime-config.json.
ui:
  spa:
    # Milliseconds between status polls on the Ingest and Scale pages.
    poll_ms: 2000
    # How long one app API call waits before giving up (seconds).
    request_timeout_s: 60
    # Largest file the upload page accepts (megabytes per file).
    max_upload_mb: 50

# marimo notebooks console (UX program Wave 6, src/corpus_kb/notebooks/):
# serves a folder of marimo .py notebooks at /notebooks on the SAME HTTP
# server. Lazy behind the [notebook] extra; without it (or without the
# folder) the server logs one line and runs on. directory resolves
# against the process working directory. Notebooks reload on restart.
notebooks:
  enabled: true
  directory: notebooks

# OpenTelemetry tracing (UX program Wave 4, src/corpus_kb/utils/tracing.py).
# Off by default: opentelemetry-api is a no-op tracer without the SDK, so
# spans cost nothing. Turn enabled on and install the [otel] extra to ship
# OTLP spans to any collector (Jaeger, Phoenix, Langfuse); see
# docs/OBSERVABILITY.md. Tracing setup failure never blocks server startup.
# otlp_endpoint is the OTLP/HTTP base URL; /v1/traces is appended.
observability:
  enabled: false
  otlp_endpoint: "http://localhost:4318"
  service_name: "corpus-kb"

# U42 provenance-keyed exact result cache (research/exact_cache.py).
# enabled gates every access (--no-cache drops it at the CLI layer);
# deductive runs default on, inductive discovery runs default off unless seeded.
cache:
  enabled: true
  deductive_enabled: true
  inductive_enabled: false

research:
  embedder:
    # G1 promotion (todo 13, explicit committed change — never a runtime write):
    # winner = naive per-text pooling + deterministic prefix; late chunking
    # showed no gain on the 52-pair fixture (recall@10 -0.154, MRR -0.496).
    # The strategy and the "1024" row revision tag are FIXED IN CODE, not
    # runtime knobs; only the promotion guard below is configurable.
    dimensions: 1024            # promotion guard: non-1024 winners HALT (research.promotion)
  ingest:
    watch_interval_s: 10        # research ingest --watch poll interval
  inductive:
    # Determinism pins (r7) are CODE CONSTANTS (coding/inductive_cluster.py:
    # UMAP random_state/transform_seed 42, n_components=10, cosine metric) and
    # are recorded in every run manifest - only governance knobs live here.
    entropy_threshold: 0.85     # normalized soft-entropy gate for the LLM meta-decision
    recluster_every_batches: 8  # full re-cluster cadence (v5 9.5: every 5-10 batches)
    centroid_drift_threshold: 0.15  # mean cosine drift between snapshots -> early refresh
    tau_dup: 0.85               # promote-time duplicate gate (calibrated from gold when available)
  cycle:
    # Human-critical gates for `research cycle --mode out` (todo 20).
    # halt_on may only ADD gates: codebook_promotion is HARD-FLOORED
    # (v5 §9.6/§14 - promotion is NEVER automated), so removing it here
    # changes nothing. Unknown gate names are rejected at run time.
    halt_on:
      - interpretive_code_review
      - gray_zone_escalation   # incl. conformal-coverage violations
      - drift_alarm            # incl. DBCV >20% cluster-validity drops
      - overlap_conflict
      - threshold_unreliable
      - human_parity_breach    # LLM-vs-human alpha < 0.60 -> human-only routing
      - unreleased_draft       # enforce-mode: a blocked deductive stage halts the cycle
  # U1–U6 release layer (research/release/profiles.py is the source of truth
  # for these values — keep in lockstep with get_default_config).
  release:
    default_profile: team-codebook
    enforcement: warn           # off | warn | enforce (enforce is strict opt-in)
    profiles:
      exploratory:
        required_gates: []
        alpha_tentative: 0.667
        alpha_reliable: 0.8
        min_audit_sample: 0
        min_stratum_size: 0
        partition_rule: none
      team-codebook:
        required_gates:
          - definition_completeness
          - machine_profile
          - partition_independence
          - reliability_alpha
          - content_stability
          - clustering_determinism
          - structured_output_enforcement
        alpha_tentative: 0.667
        alpha_reliable: 0.8
        min_audit_sample: 30
        min_stratum_size: 10
        partition_rule: disjoint
        per_code_f1_floor: 0.7
        content_stability_floor: 0.75
        prompt_stability_alpha: 0.667
        alt_test_margin: 0.05
        alt_test_passing_fraction: 0.5
        max_stratum_disparity: 0.15
        agreement_routing_threshold: 0.8
      high-assurance:
        required_gates:
          - definition_completeness
          - machine_profile
          - partition_independence
          - reliability_alpha
          - heldout_per_code_f1
          - content_stability
          - prompt_stability
          - alternative_annotator_test
          - prediction_powered_estimates
          - stratum_disparity
          - audit_sample_design
          - agreement_calibration
          - boundary_agreement
          - clustering_determinism
          - structured_output_enforcement
          - quote_consensus
        alpha_tentative: 0.667
        alpha_reliable: 0.8
        min_audit_sample: 100
        min_stratum_size: 20
        partition_rule: disjoint
        per_code_f1_floor: 0.8
        content_stability_floor: 0.85
        prompt_stability_alpha: 0.8
        alt_test_margin: 0.05
        alt_test_passing_fraction: 0.8
        max_stratum_disparity: 0.1
        agreement_routing_threshold: 0.9
  # U48 multi-run consensus (research/cycle_consensus.py is the typed reader;
  # research/release/consensus.py does the aggregation)
  consensus:
    runs: 3                    # N independent inductive passes per cycle
    min_run_fraction: 0.5      # theme kept when seen in >= this fraction of runs
    similarity_threshold: 0.8  # cosine at which candidates join one theme
  # Measurement-math knobs (coding/measurement_settings.py is the source of
  # truth; U12–U17, U33–U39, U41, U47).
  alt_test:
    margin: 0.1
    fdr_q: 0.05
    passing_fraction: 0.5
    method: exact_binomial
    n_bootstrap: 10000
  prompt_stability:
    alpha_threshold: 0.667
    min_variants: 2
  routing:
    target_risk: 0.05
    confidence_level: 0.95
    min_calibration_n: 30
  audit:
    sample_rate: 0.1
    seed: 42
  review:
    batch_size: 20
    random_fraction: 0.2
    diversity: true
  labeling:
    aggregation: em
    min_signals: 3
    cv_folds: 5
    flag_threshold: 0.2
  judgment_distribution:
    use_mean: false

routing:
  enabled: true
  confidence_threshold: 0.35
  prototypes:
    semantic:
      - "what does the document say about X"
      - "explain the concept of X"
      - "summarize the section on X"
    relational:
      - "how many documents mention X"
      - "count the chunks by type"
      - "aggregate statistics across the corpus"
    graph:
      - "what is related to X"
      - "how is X connected to Y"
      - "what entities are linked to X"

# Opt-in GLiNER2 NER (extraction/gliner_backend.py). Six mention-level
# types with one-line definitions passed at inference; spans map onto
# ontology entity types (person->Person, organization->Org, product->
# Product, the rest fall back to Concept). No relation extraction.
# backend: gliner refuses to construct while gliner.enabled is false.
extraction:
  # PREFERRED extraction-backend key (ml | regex | langextract | pgml | gliner).
  # "ml" is the default paved path: GLiNER2 NER + GLiNER-Relex zero-shot
  # relations under extraction.mode. Install the `ml` extra (setup does) so
  # the models load; a bare install degrades honestly through the extraction
  # fallback chain. The legacy key graph.extractor keeps working forever as
  # an alias; when both are set, extraction.backend wins
  # (config.apply_extraction_backend_alias).
  backend: ml
  # zero_shot: GLiNER2 + GLiNER-Relex, ontology-conditioned, no examples.
  # few_shot: LangExtract with examples self-prompted from the ontology.
  # customized: few_shot + project exemplars mined from this tenant's stored
  # high-confidence relations.
  mode: zero_shot
  gliner:
    enabled: false
    model: fastino/gliner2-large-v1
    revision: main
    types: [person, organization, location, date, money, product]
  relex:
    model: knowledgator/gliner-relex-large-v1.0
    threshold: 0.5
    max_label_pairs: 40
  # LoRA adapter tuning (extraction-tune method=lora; needs the `tune`
  # extra). The adapter is a candidate artifact — the eval promotion gate
  # decides whether extraction ever uses it.
  tune:
    model: knowledgator/gliner-multitask-large-v0.5
    steps: 200
    learning_rate: 5.0e-5
    batch_size: 2
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
  # Optional voting across extractors (issue #133). Members run the primary
  # plus the named extra backends; candidates survive on majority agreement.
  ensemble:
    enabled: false
    members: [langextract]
  # Chunk-hash result cache (migration 030): re-ingesting unchanged content
  # skips the extraction pass entirely. Hits are reported in ExtractStats.
  cache:
    enabled: true

statements:
  # Statement atoms (Living Corpus W2, migration 031): chunks atomize into
  # classified, bi-temporal statement rows via the claim-template catalogue.
  enabled: true
  templates_dir: config/claim_templates
  # Per-chunk cap on atoms (deterministic order; overflow is dropped and
  # reported in the stage note).
  max_per_chunk: 12

graph:
  backend: age
  # Graph traversal depth cap (1..25; 25 is today's AGE cap). Consumed by
  # the graph neighbor/traverse operations.
  max_hops: 5
  # Legacy alias for extraction.backend (accepted forever; extraction.backend
  # wins when both are set).
  extractor: ml
  fixture_dir: tests/fixtures/langextract_recorded
  live_fallback: false
  ontology_path: config/ontology.yaml
  model_version: langextract-default
  prompt_version: v1

installer:
  postgres_image: ghcr.io/moliver28/corpus-kb-postgres:0.1.0-pg17
  data_dir: ~/.corpus-kb
  verify_image_signature: true
  # All three profiles embed at 2560 dims (the schema width); only the LLM
  # varies. A different embedding width needs a schema migration first.
  profiles:
    minimal: { ram_gb_max: 8, vram_gb_max: 0, model: "qwen3-embedding:4b", llm: "qwen3:0.6b" }
    balanced: { ram_gb_max: 16, vram_gb_max: 4, model: "qwen3-embedding:4b", llm: "qwen3:4b" }
    performance: { ram_gb_max: 999, vram_gb_max: 8, model: "qwen3-embedding:4b", llm: "qwen3:14b" }

database:
  # Storage engine selector: postgres (default) or duckdb. The loader
  # refuses Postgres-only engines (AGE, pgml) while duckdb is set.
  # Env override: CORPUS_KB_DATABASE_BACKEND (docs/ADMIN.md).
  backend: postgres
  connection_string: postgresql://corpus_user:corpus_pass@localhost:5433/corpus_kb

# LLM for chat + text generation via local Ollama HTTP API
# (replaces archived pgai; no cloud APIs — nothing leaves the machine).
llm:
  model: qwen3:4b
  base_url: http://localhost:11434

# Qualitative coding pipeline behind the /api/coding/* routes.
coding:
  coder: qwen3:8b
  model: qwen3:8b
  # U43 validate/repair: retries before a response is marked
  # invalid_output; strict enforcement opt-in (default off).
  repair_retries: 1
  require_structured_enforcement: false

# Multi-granularity chunk hierarchy + shadow index (ingest/hierarchy_settings.py
# is the source of truth). enabled writes the shadow hierarchy at ingest; the
# live v1 corpus is untouched. expand_to_parent lives under retrieval now.
ingest:
  chunking:
    enabled: true
    child_tokens: 128
    chunk_tokens: 512
    parent_tokens: 2048
    overlap_tokens: 64
    respect_boundaries: ["speaker_turn", "qa_pair", "slide", "heading"]
  contextualize:
    # feature-flagged; enabled per-source_type at ingest time (Task 12/16)
    enabled: false
    enabled_source_types: ["interview", "research"]
    # W3 contextualize v2 keys. Only "ollama" is supported; other values
    # are rejected at load. Blurb generation degrades honestly to an empty
    # blurb when the model is not pulled or Ollama is down.
    backend: ollama
    model: qwen3:8b
    # "interview" names the moderator question (transcript sources);
    # "generic" is the neutral template for any document.
    prompt_profile: interview
    # Cap on the GENERATED blurb (chars/4 estimated tokens).
    max_context_tokens: 100
    # true = document context first, then the chunk (the recommended order).
    document_first_prompt: true
    # Write-time targets: "embedding" puts blurb+text into the embed input,
    # "lexical" writes the chunks.context_blurb column the FTS expression
    # reads. Default keeps both (pre-W3 behavior).
    apply_to: ["embedding", "lexical"]
    base_url: http://localhost:11434
    temperature: 0.0
    fixture_dir: tests/fixtures/contextual_recorded
    live_fallback: false
