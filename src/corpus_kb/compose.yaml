# Image-first Docker Compose for Corpus-KB.
#
# DEFAULT STACK (no profile): PostgreSQL 17 only, from the pinned pre-built
# image. Ollama is expected to run natively or externally; it is no longer
# part of the default compose stack. `corpus-kb setup` and a bare
# `docker compose up` keep this behavior byte-for-byte.
#
#   docker compose up -d          # start Postgres from the pre-built image
#   docker compose down -v        # stop and remove data volumes
#
# Image: ghcr.io/moliver28/corpus-kb-postgres:0.1.0-pg17 (extensions + grant init baked); local build fallback: compose.build-local.yaml.
# FULL APP STACK (profile `app`): builds the Corpus-KB server image and runs
# it against the same Postgres. The server binds 0.0.0.0:8010 on the host,
# so a NAS serves the UI on the LAN at http://<nas-ip>:8010/app/.
#
#   docker compose --profile app up -d --build
#
# Search runs in degraded zero-vector mode until Ollama serves the embedder.
# Enable the `ollama` profile for a same-stack Ollama, then point the app at
# it and pull the model (see docs/INSTALL.md, "Run the whole app in Docker"):
#
#   CORPUS_KB_OLLAMA_HOST=http://ollama:11434 \
#   docker compose --profile app --profile ollama up -d --build
#   docker compose exec ollama ollama pull qwen3-embedding:4b
#
# To build the Postgres image locally instead of using the pre-built image:
#   corpus-kb setup --build-local
#   # or manually:
#   docker compose -f compose.yaml -f compose.build-local.yaml up -d --build

services:
  postgres:
    image: ghcr.io/moliver28/corpus-kb-postgres:0.1.0-pg17
    container_name: corpus-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corpus_user
      POSTGRES_PASSWORD: corpus_pass
      POSTGRES_DB: corpus_kb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus_user -d corpus_kb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: ghcr.io/moliver28/corpus-kb-app:0.1.0
    container_name: corpus-kb-app
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # In-network DSN; the same sanctioned credentials as the postgres
      # service above.
      CORPUS_KB_DATABASE_URL: postgresql://corpus_user:corpus_pass@postgres:5432/corpus_kb
      # Ollama endpoint. Interpolation keeps the app honest when the
      # ollama profile is off: unset means the packaged default
      # (localhost:11434), which degrades to zero vectors exactly like a
      # native setup without Ollama.
      CORPUS_KB_OLLAMA_HOST: ${CORPUS_KB_OLLAMA_HOST:-http://localhost:11434}
    ports:
      # 0.0.0.0 on purpose: NAS LAN access to the UI at /app/.
      - "8010:8010"
    healthcheck:
      # GET /app/ — the SPA index route (corpus_kb/ui/spa.py). The wheel
      # self-check in docker/app/Dockerfile guarantees the dist exists.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request as u; r = u.urlopen('http://127.0.0.1:8010/app/', timeout=5); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:0.40.16
    container_name: corpus-kb-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # No host port: the app reaches Ollama over the compose network at
    # http://ollama:11434 (set CORPUS_KB_OLLAMA_HOST, see the header).

volumes:
  postgres_data:
  ollama_data:
