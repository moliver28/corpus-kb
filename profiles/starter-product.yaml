name: starter-product
description: >-
  Paved starting profile for product corpora. Survey exports become
  question and answer chunks. Web pages chunk per heading section.
  Markdown files chunk at heading boundaries. Validation runs in
  advisory mode. Findings ride the ingest result. They never block
  a write. Edit freely, or copy it and rename.
data_type: product
ingestion:
  strategies:
    survey: survey
    web: web_structure
    markdown: markdown_sections
  default: default
validate: advisory
