MinAlertLevel = suggestion

StylesPath = styles

[*.md]
BasedOnStyles = CorpusSTE

# Test fixtures are data, not prose.
[tests/**/*.md]
BasedOnStyles =

# The changelog is a frozen release record; entries are historical.
[CHANGELOG.md]
BasedOnStyles =

# Research archives are historical records (wave verdicts, benchmark
# baselines, reconciliation tables). Splitting their sentences rewrites
# frozen history; the STE gate applies to operational docs instead.
[docs/research/**/*.md]
BasedOnStyles =

# Program spike findings are frozen evidence (probe verdicts, raw error
# strings, citation tables) in the same category as research archives.
[findings/**/*.md]
BasedOnStyles =

# Machine-generated markdown: scripts/gen_harness_pack.py is the author
# (quoted YAML scalars since Wave 5); at most Vale warns on it.
[.claude/**/*.md]
BasedOnStyles =

[.opencode/**/*.md]
BasedOnStyles =
