# Corpus-KB prose linting (zero-drift Wave 5A).
# Style: styles/CorpusSTE — an ASD-STE100-derived house style.
# Scope: Markdown only. Code strings are gated by tests/test_plain_language.py
# (`pytest -m ste`), which Vale cannot reach.
#
# Run locally:  vale README.md docs/*.md

MinAlertLevel = suggestion

StylesPath = styles

[*.md]
BasedOnStyles = CorpusSTE
