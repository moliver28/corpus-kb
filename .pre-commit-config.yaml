# Pre-commit hooks for the corpus-kb repository.
# Install: `pip install pre-commit && pre-commit install`
# Run on demand: `pre-commit run --all-files` (or `poe hooks`)
#
# Wave 3 zero-drift gate: ruff check + ruff format + config validation,
# all offline/no-network. Type-checking, tests, and the vulture/deptry/
# xenon/diff-cover gates stay in poe/CI (they need the full environment).
#
# Deliberately EXCLUDED: the file-rewriting hygiene hooks
# (trailing-whitespace, end-of-file-fixer, mixed-line-ending). A
# `run --all-files` of those rewrote hundreds of files in one sweep (they
# do not match the committed tree's line-ending state), which is exactly
# the mass churn a zero-drift wave must not produce.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Validate YAML files
      - id: check-json
        name: Validate JSON files
      - id: check-added-large-files
        name: Block large files (>500 KB)
        args: ["--maxkb=500"]
      - id: check-merge-conflict
        name: Block merge conflict markers

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the ruff the poe lint gate runs (repo dev env
    # pins ruff==0.15.18; ci.yml installs the same version).
    rev: v0.15.18
    hooks:
      - id: ruff-check
        name: Ruff lint (Python files only)
        args: [--fix]
        files: \.pyi?$
      - id: ruff-format
        name: Ruff format (Python files only)
        files: \.pyi?$

  - repo: local
    hooks:
      - id: validate-configs
        name: validate MCP/runtime configs
        entry: python src/corpus_kb/_setup/validate_configs.py
        language: system
        pass_filenames: false
        files: ^(config\.yaml|src/corpus_kb/config\.yaml|mcp-configs/.*\.json|opencode\.json)$
