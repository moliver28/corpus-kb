[project]
name = "corpus-kb"
version = "0.1.0"
description = "Local end-to-end RAG system with MCP interface for agentic code editors"
readme = "README.md"
requires-python = ">=3.11"
# SPDX license expression (PEP 639). Replaces the legacy { text = "MIT" }
# table form; the matching "License :: OSI Approved :: MIT License" classifier
# is intentionally absent because PyPI/PEP 639 treat license classifiers as
# superseded (and conflicting) once a license expression is declared.
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "rag",
    "retrieval-augmented-generation",
    "mcp",
    "knowledge-base",
    "knowledge-graph",
    "embeddings",
    "vector-search",
]

authors = [
    { name = "Michael Oliver", email = "63178353+moliver28@users.noreply.github.com" },
]

dependencies = [
    "mcp[cli]>=1.0",
    # httpx is imported directly (web fetch, HTTP surfaces, MCP client glue).
    # Floor matches ollama's own httpx requirement so one shared resolver
    # range covers both (previously transitive-only; zero-drift Wave 4B).
    "httpx>=0.27",
    "ollama>=0.4",
    "pyyaml>=6.0",
    # tree-sitter + the grammars live in the [code] extra (unified-ingestion
    # Wave 5): the AST code chunker imports them lazily behind the file-type
    # gate, so base installs no longer carry them (deptry ratchet closed).
    "pydantic>=2.0",
    # TypeIs (gateway seam narrowing) is 3.13+ stdlib; the repo floor is 3.11.
    "typing-extensions>=4.10",
    "rich>=13.0",
    # unstructured[md]: the md extra ships the `markdown` package that
    # partition_md() needs. Plain `unstructured` cannot ingest markdown —
    # the most common RAG format — so the extra is REQUIRED, not optional.
    "unstructured[md]>=0.13",
    # python-pptx: pure-Python MIT, first-class PPTX structure.
    "python-pptx>=1.0",
    # defusedxml: XXE/billion-laughs-safe parsing of untrusted XML
    # (REFI-QDA project imports, pptx part XML). The Python-docs
    # recommendation; declared directly because both importers use it.
    "defusedxml>=0.7.1",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "numpy>=1.26",
    # The spaCy C-stack caps below pin the trio to the last CI-proven
    # versions (2026-10-24 morning run): three same-day patch releases
    # (cymem 2.0.16, murmurhash 1.0.16, preshed 3.0.14) broke spaCy's
    # tokenizer deserialization on Unix — "OverflowError: Python int too
    # large to convert to C ssize_t" from Tokenizer._flush_specials (a
    # PreshMap iteration) while loading en_core_web_sm — crashing every
    # unstructured partition on Linux/macOS CI. Windows wheels are
    # unaffected, so local runs pass while CI burns. They are declared
    # directly so BOTH pip (CI) and uv respect the caps; lift each one
    # after verifying the partition + DuckDB ingest legs on ubuntu.
    "cymem<2.0.14",
    "murmurhash<1.0.16",
    "preshed<3.0.14",
    "eventsourcing[postgres]>=9.0",
    # Deliberate "no new REQUIRED deps" deviation (review F-4): fresh installs
    # bind the system libpq via wheel-less psycopg and crash at the first
    # event-store write (Connection.pipeline() needs libpq >= 14). Declaring
    # psycopg[binary] pulls BOTH the psycopg package (imported directly by the
    # CLI error handler, previously only a transitive of eventsourcing[postgres])
    # and the wheel distribution that bundles libpq 17. License: LGPL-3.0 WITH
    # the psycopg exception (distribution permitted); licenses.lock.json
    # regenerated.
    "psycopg[binary]>=3.1",
    "starlette>=0.35",
    "typer>=0.15",
    "uvicorn>=0.24",
    # fastapi: the HTTP composition root returns FastAPI (a Starlette
    # subclass) and its router/TestClient surface serves every route.
    # Pure-Python MIT.
    "fastapi>=0.115",
    # opentelemetry-api ONLY: no-op tracers when the [otel] extra is absent
    # (Apache-2.0, one transitive). SDK + OTLP exporter live in the extra.
    "opentelemetry-api>=1.45",
    "psutil>=6.0",
    "llama-index-core>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
    "llama-index-llms-ollama>=0.4",
    "llama-index-embeddings-ollama>=0.4",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/moliver28/corpus-kb"
Repository = "https://github.com/moliver28/corpus-kb.git"
Documentation = "https://github.com/moliver28/corpus-kb"
Issues = "https://github.com/moliver28/corpus-kb/issues"
Changelog = "https://github.com/moliver28/corpus-kb/blob/master/CHANGELOG.md"

[project.optional-dependencies]
graphqlite = ["graphqlite>=0.4"]
langextract = ["langextract"]
pynvml = ["pynvml"]
# DuckDB storage backend (storage portability program, issue #127, rule 9):
# opt-in engine behind graph.backend: duckdb. MIT license. The 1.4 LTS pin
# (decision log 2026-10-19) was lifted to the vetted 1.5 line on 2026-10-24
# (partition + DuckDB ingest legs verified locally; CI re-verifies on
# ubuntu). 2.0.0 was probed the same day and FAILS the migration runner:
# its binder rejects the attach-qualified DDL with "Ambiguous reference to
# catalog or schema \"corpus\"" (17 leg failures) — lifting to 2.x is a
# port of the qualification scheme, not a bump. NEVER move this into base
# dependencies (rule 9: license-lock churn). CI installs this extra from
# the first-import commit onward (§11 rule 1); until that commit lands, the
# extras-less jobs stay green (unlike latechunk/inductive/ner/topics, whose
# imports stay lazy behind config gates).
# pytz: DuckDB TIMESTAMPTZ fetches and binds need it at runtime (three
# independent WPs hit the missing wheel on the phase C/D ports).
duckdb = ["duckdb>=1.5,<2.0", "pytz"]
# Late chunking (todo 13, v5 5.3): token-level hidden states need the local
# transformers stack, never Ollama's pooled endpoint. License-reviewed
# permissive set: sentence-transformers Apache-2.0, transformers Apache-2.0,
# torch BSD-3-Clause. The transformers floor is the first release with the
# Qwen3 architecture (Qwen3-Embedding-0.6B, 1024-dim, 32k context).
# CI NEVER installs this extra; the extras-less jobs must stay green.
latechunk = [
    "sentence-transformers>=2.7",
    "transformers>=4.51.0",
    "torch>=2.2",
]
# Inductive engine (todo 15, v5 §9): UMAP reduction + HDBSCAN clustering.
# License-reviewed permissive set: umap-learn BSD-3-Clause, hdbscan BSD-3-Clause
# (both pull numba/llvmlite/scikit-learn, all BSD-family). CI NEVER installs
# this extra; the extras-less jobs must stay green (same contract as latechunk).
inductive = [
    "umap-learn>=0.5",
    "hdbscan>=0.8.36",
]
# ML extraction engine (Living Corpus W1): GLiNER2 schema-conditioned NER
# (extraction/gliner_backend.py) + GLiNER-Relex zero-shot relations
# (extraction/relex_backend.py), composed by extraction.backend: ml
# (extraction/ml_backend.py, extraction.mode: zero_shot|few_shot|customized).
# Both packages import lazily (extraction/_gliner2_types.py,
# extraction/_gliner_types.py) so extras-less jobs stay green and tests fake
# the models. The installer's `ml` extra makes the paved path real for setup
# users; a bare install degrades honestly through the extraction fallback
# chain (recorded in ExtractStats.notes, never silently).
# License-reviewed permissive set: gliner2 Apache-2.0, gliner Apache-2.0
# (torch BSD-3-Clause transitive).
ml = ["gliner2>=2.1.0", "gliner>=0.2.13", "huggingface_hub>=0.30"]
# LoRA adapter tuning (Living Corpus W5, extraction_tune method=lora):
# peft injects the low-rank adapter; gliner[training] ships the
# train_model loop. Same license family as [ml] (Apache-2.0 + BSD torch).
tune = ["peft>=0.11", "gliner[training]>=0.2.13"]
# Topic modeling over stored chunk embeddings (topics/engine.py, Wave 4;
# gated by topics.enabled + the [topics] extra). BERTopic 0.16 is the
# first line with the pinned-UMAP + precomputed-embeddings fit used here
# and pulls the same BSD-family umap-learn/hdbscan/scikit-learn stack the
# inductive extra already reviews. CI NEVER installs this extra; the
# import is lazy inside the engine entry, so the extras-less jobs stay
# green (same contract as latechunk/inductive/ner).
topics = ["bertopic>=0.16"]
# Browser UI (UI SPA program Task 3): the lifecycle SPA is built by Vite
# (ui_src/, Node build-time only) into src/corpus_kb/ui_dist/ and served
# as static files at /app — no Python runtime UI dependency anymore.
# uvicorn[standard] stays for the websocket-capable server layer.
# python-multipart (UI SPA Task 5a, B3): the multipart parser starlette's
# request.form() needs for POST /api/ingest/upload. Apache-2.0. The route
# answers a typed 503 dependency_missing when the extra is absent.
# CI NEVER installs this extra; the extras-less jobs stay green.
ui = [
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.20",
]
# Tracing (UX program W4): opentelemetry-api is already a core dep (it is
# a no-op without this extra). The extra adds the SDK, the pure-Python
# OTLP-over-HTTP exporter (no grpcio on Windows), and the OpenInference
# span-attribute vocabulary (zero deps, Apache-2.0; official OTel GenAI
# semconv are still experimental). CI NEVER installs this extra.
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "openinference-semantic-conventions>=0.1.41",
]
# Offline evaluation (UX program W5): DeepEval is Apache-2.0 with an
# official Ollama integration (local judge, no API key, no cloud). It
# hard-depends on the openai SDK — offline-safe because the judge is only
# ever pointed at local Ollama. CI NEVER installs this extra.
eval = ["deepeval>=4.3"]
# Token-budget chunking (unified-ingestion Wave 4): semchunk splits
# oversized text on sentence or word boundaries and returns native char
# offsets, replacing the fixed chars/4 slices behind
# ingestion.tokenizer: semchunk (ingestion/tokenizer.py). MIT. The token
# counter stays the sanctioned chars/4 basis; semchunk owns the
# boundaries. CI NEVER installs this extra; the import is lazy behind the
# config gate, so the extras-less jobs stay green (same contract as
# latechunk/inductive/ner/topics).
semchunk = ["semchunk>=4.1,<5"]
# Near-duplicate dedup (unified-ingestion Wave 4): MinHash LSH over word
# sets behind ingestion.dedup: minhash (ingestion/dedup.py). MIT. 2.0.0
# changed the default MinHash permutation scheme, so never reuse sketches
# across versions — we never persist them. CI NEVER installs this extra;
# the import is lazy behind the config gate (same contract as latechunk).
dedup = ["datasketch>=2.0,<3"]
# Calibration statistics (unified-ingestion Wave 7, plan Phase 4): paired
# comparison and ranking metrics via ranx (MIT). CI NEVER installs this
# extra; eval/stats.py falls back to the plain sign test and the report
# names the method that ran (same lazy contract as semchunk/dedup).
calibrate = ["ranx>=0.3,<0.4"]
# Tree-sitter AST code chunking (unified-ingestion Wave 5): the [code]
# extra restores grammar-aware chunking for source files
# (ingestion/strategies/code.py). MIT. The import is lazy behind the
# file-type gate; without the extra, code files fall back to the default
# strategy's plan with a warnings entry. CI NEVER installs this extra; the
# extras-less jobs stay green (same contract as semchunk/dedup).
code = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]
# Researcher console (UX program W6): marimo notebooks are reproducible
# .py files served by the running server via create_asgi_app. Apache-2.0.
# CI NEVER installs this extra (same lazy contract).
notebook = ["marimo>=0.25"]
# Few-shot classification head (analysis program WP-3): the logistic head
# over the stored embeddings runs on scikit-learn (BSD-3-Clause), the
# same stack the [topics] extra already reviews transitively. CI NEVER
# installs this extra; the import stays lazy behind
# analysis.classification.enabled, so the extras-less jobs stay green
# (same contract as latechunk/inductive/ner/topics).
classify = ["scikit-learn>=1.5", "threadpoolctl>=3.5"]
# Opt-in SetFit tier (analysis.classification.tier: setfit): SetFit is
# Apache-2.0 and pulls sentence-transformers + transformers; torch is
# already reviewed in the latechunk extra. CI NEVER installs this extra;
# the import stays lazy behind the tier gate, so the extras-less jobs
# stay green (same contract as latechunk/inductive/ner/topics).
setfit = ["setfit>=1.2"]
# lxml is TEST-ONLY: real XSD validation of REFI-QDA exports in
# tests/test_refi_qda.py (U27) via lxml.etree.XMLSchema. The runtime module
# (coding/refi_qda) is stdlib-only; every lxml use is behind
# pytest.importorskip so the suite passes without it.
# MAPIE cross-check of the in-repo conformal layer (issue #78, U28). Tests
# only (tests/test_mapie_crosscheck.py), NEVER a runtime dependency; MAPIE is
# BSD-3-Clause. Floor is 1.0: the test drives the SplitConformalClassifier
# "top_k"/"aps" API introduced by the 1.x overhaul (0.8.x has none).
# poethepoet + import-linter (Wave 2 zero-drift): the gate commands and the
# layering contracts. CI calls the SAME poe targets developers run.
# Wave 3 quality gates: vulture (dead code), deptry (unused deps), xenon
# (complexity), diff-cover (diff coverage), pre-commit (hook runner). The
# gates run through poe (``poe dead-code`` etc.) so local, CI, and agents
# execute one command each (program standards 7/8/10).
dev = [
    # ruff: the lint gate (poe lint, ci.yml lint job) runs it but it was
    # never declared - a locked-environment sync dropped it silently.
    # Pinned to the exact ci.yml version so local lint == CI lint.
    "ruff==0.15.18",
    # python-magic-bin: the libmagic DLL that unstructured's binary format
    # detection needs on Windows (see ci.yml: `pip install python-magic-bin`
    # on the Windows test job). Declared with a platform marker so a local
    # `uv sync` on Windows restores what CI installs by hand; Linux keeps
    # the system libmagic package and macOS brew-installs it.
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "syrupy>=4.0",
    "lxml>=5.0",
    "mapie>=1.0",
    # python-multipart (UI SPA Task 5a): the CI test jobs install [dev] but
    # never [ui]; the upload-route tests exercise the REAL multipart parse,
    # so the parser must exist there too (a local-only gate is not a gate).
    "python-multipart>=0.0.20",
    "poethepoet>=0.24",
    "import-linter>=2.0",
    "vulture>=2.10",
    "deptry>=0.20",
    "xenon>=0.9",
    "diff-cover>=9.0",
    "pre-commit>=4.0",
    # Plain-language gate (zero-drift Wave 5A): Flesch-Kincaid grading for
    # tests/test_plain_language.py (`pytest -m ste`). Dev-only on purpose —
    # no runtime dependency.
    "textstat>=0.7",
    # Schema-parity gate (storage portability, issue #127 wave G): static
    # diff of the CREATE TABLE state of both migration sets. Dev-only and
    # pinned to the version the gate was written against (30.x).
    "sqlglot>=30.24,<31",
]

[build-system]
# 77.0.3 is the PEP 639 floor: the string `license` + `license-files` fields
# above are rejected by older setuptools even under build isolation.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["corpus_kb*"]

[tool.setuptools.package-data]
# migrations_duckdb/*.sql (rule 12): the glob ships BEFORE the first DuckDB
# migration file so the migrations WP cannot land a broken wheel.
# ui_dist/**/* (UI SPA program Task 3, spec D.7): the built SPA ships as
# package data; a source checkout without a build degrades honestly
# (mount_spa logs one line, the API keeps serving).
corpus_kb = [
    "*.yaml",
    "config/*.yaml",
    "migrations/*.sql",
    "migrations_duckdb/*.sql",
    "ui_dist/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# tests/whitelist.py: the vulture whitelist. Bare names are intentional
# references (vulture parses the file; nothing imports or runs it).
#   F821: names are intentionally undefined here.
#   B018: bare-name expressions are the whole point of a whitelist.
"tests/whitelist.py" = ["F821", "B018"]

[tool.deptry]
known_first_party = ["corpus_kb"]

[tool.deptry.per_rule_ignores]
# Opt-in extras (latechunk/inductive/ner/graphqlite/langextract): their
# modules are imported lazily behind runtime gates and CI never installs
# them, so deptry cannot see the import edge. Same contract as the extras'
# comments above.
DEP002 = [
    "graphqlite",
    "langextract",
    "sentence-transformers",
    "transformers",
    "torch",
    "umap-learn",
    "hdbscan",
    "gliner2",
    "gliner",
    # python-magic-bin ships the libmagic DLL on Windows (dev group,
    # sys_platform marker); the `magic` module it serves comes from
    # python-magic itself, so nothing ever imports this distribution.
    "python-magic-bin",
    # The spaCy C-stack caps (see dependencies: cymem/murmurhash/preshed)
    # are never imported by corpus_kb code — spaCy consumes them.
    "cymem",
    "murmurhash",
    "preshed",
    # LoRA tuning (Living Corpus W5, extraction/lora_tune.py) imports
    # peft lazily behind extraction_tune(method="lora"); CI never installs
    # the [tune] extra, so deptry cannot see the import edge.
    "peft",
    # setup weight pre-pull imports huggingface_hub via importlib (CI never
    # installs the [ml] extra), so deptry cannot see the import edge.
    "huggingface_hub",
    # topics/engine.py imports bertopic lazily behind topics.enabled and CI
    # never installs the extra, so deptry cannot see the import edge.
    "bertopic",
    # Analysis program extras (classify/setfit): the classification tier
    # imports these lazily behind analysis.classification.* and CI never
    # installs them, so deptry cannot see the import edges.
    "scikit-learn",
    "setfit",
    # Wave 4 extras (semchunk/dedup): imported lazily behind the
    # ingestion.tokenizer / ingestion.dedup config gates; CI never installs
    # them, so deptry cannot see the import edges.
    "semchunk",
    "datasketch",
    # Wave 7 extra (calibrate): eval/_ranx.py imports ranx lazily behind a
    # try/except probe; CI never installs it, so deptry cannot see the edge.
    "ranx",
    # UX program extras (W0): every consumer imports these lazily behind
    # runtime gates and CI never installs them, so deptry cannot see the
    # import edges.
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "openinference-semantic-conventions",
    "deepeval",
    "marimo",
    # The [duckdb] extra (storage portability program, rule 9) ships ahead of
    # its first consumer: the plain function-local `import duckdb` lands with
    # the storage work package, not with the extra. Unlike the extras above,
    # rule 9 forbids importlib for duckdb — the import must stay deptry-
    # visible — so this entry self-retires once that import lands. DEP004 is
    # ignored separately below.
    "duckdb",
    # pytz (storage portability, phase D): duckdb's own runtime imports it
    # when it materializes TIMESTAMPTZ values; our source never imports it.
    # It ships in the [duckdb] extra so the backend works without system
    # packages.
    "pytz",
    # python-multipart (UI SPA Task 5a, B3): starlette's request.form()
    # imports it at runtime to parse POST /api/ingest/upload bodies; our
    # source never imports it directly (the route checks find_spec first).
    "python-multipart",
    # sqlglot (storage portability, phase G): the schema-parity gate imports
    # it from scripts/, which deptry does not scan (deptry src/). Static
    # analysis only, per the program doc §17.
    "sqlglot",
    # Dev/tooling deps: consumed by tests/ and the gate commands, never
    # imported by src/.
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "syrupy",
    "mapie",
    "poethepoet",
    "import-linter",
    "vulture",
    "deptry",
    "xenon",
    "diff-cover",
    "pre-commit",
    "textstat",
    # Lint gate tool (poe lint, ci.yml): consumed as a program, never imported.
    # Pinned to the ci.yml version in the dev extra so local lint == CI lint.
    "ruff",
    # Declared but unreferenced in src/ today. Ratchet follow-up: verify and
    # drop, or document the dynamic use (pgvector may register types without
    # an import edge; rich may be a typer extra).
    "rich",
    "pgvector",
    # Wave 5 [code] extra: strategies/code.py + strategies/ast_chunks.py
    # import the grammars via importlib (the semchunk pattern), so deptry
    # cannot see the edges. The rows stay: the deps ARE used, the import
    # is dynamic by design (extras-less CI must stay green).
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-java",
]
# httpx is imported directly in ten modules but arrives transitively (via
# mcp[cli]/ollama). Ratchet follow-up: declare httpx explicitly and
# regenerate licenses.lock.json in a dependency-scoped PR.
DEP003 = ["httpx"]
# The [duckdb] extra (storage portability program, rule 9): the first
# `import duckdb` must not trip DEP004 (missing), because the distribution
# is declared in the extra, never in base dependencies. Never `importlib`
# strings — the import must stay deptry-visible.
DEP004 = ["duckdb"]

[tool.pytest.ini_options]
markers = [
    "requires_ollama: mark test as needing a running Ollama service",
    "requires_hi_res: mark test as needing Unstructured hi_res (detectron2)",
    "ste: ASD-STE100 plain-language gate (docs, error strings, tool docstrings)",
    "slow: long-running perf fixture (100k synthetic chunks); skipped unless CORPUS_KB_PERF_RUN=1",
]
asyncio_mode = "auto"
# Pin the pytest-asyncio 1.x default explicitly: same behavior as today,
# and it silences the plugin's per-session deprecation warning.
asyncio_default_fixture_loop_scope = "function"
# Third-party warning noise (no repo-side fix exists):
# - umap warns that random_state pins n_jobs=1 — our determinism contract
#   (inductive engine, r7) sets random_state on purpose.
# - pynvml deprecation: pypi.org/project/pynvml tells maintainers to move to
#   nvidia-ml-py; we consume it transitively and must not add the replacement.
# - sklearn 1.9.1's HDBSCAN emits the copy-deprecation notice from its own
#   internals (its copy default flips to True in 1.10) and its copy= value
#   crashes cosine_distances — an upstream bug (sklearn#33219), fixed when
#   1.10 lands. We pass no copy; the notice is third-party noise.
filterwarnings = [
    'ignore:n_jobs value 1 overridden to 1 by setting random_state:UserWarning',
    'ignore:The pynvml package is deprecated:FutureWarning',
    'ignore:The default value of `copy` will change from False to True:FutureWarning',
]

# ---------------------------------------------------------------------------
# Zero-drift gate commands (Wave 2). CI calls the SAME targets — one source
# of gate commands for humans, agents, and CI (program standards 8/10).
# NOTE: the old `style = "simple"` option was removed — poethepoet >= 0.48
# rejects it, which broke every poe invocation.
[tool.poe]

[tool.poe.tasks.lint]
cmd = "ruff check src/ tests/"
help = "Ruff lint over the package and tests"

[tool.poe.tasks.lint-imports]
cmd = "lint-imports"
help = "Import layering contracts (Wave 2; contracts in [tool.importlinter])"

[tool.poe.tasks.format-check]
cmd = "ruff format --check src/ tests/"
help = "Ruff format check (no rewrites)"

[tool.poe.tasks.types]
cmd = "pyright src/"
help = "Pyright type check (basic mode, repo config)"

# ---------------------------------------------------------------------------
# Wave 3 quality gates (program standards 7/8/10). Each gate: a poe target
# here, a CI job (wired by integration), and an enforcement-map row.
# ---------------------------------------------------------------------------

[tool.poe.tasks.dead-code]
cmd = "vulture src/ tests/whitelist.py"
help = "Vulture dead-code scan; tests/whitelist.py carries verified false positives"

[tool.poe.tasks.deps]
cmd = "deptry src/"
help = "deptry unused/missing dependency scan (config in [tool.deptry])"

# Ratchet plan (W6B: the last D blocks are gone — the 15 former D functions
# were split into cohesive same-module helpers, SQL byte-identical where
# pinned; absolute C now passes):
#   W7+: fix the C blocks above B -> max-absolute B (the end state).
# max-average B is the current-passing mean; any broad complexity
# regression trips it. NOTE for future editors: no percent sign in this
# file — radon (xenon's engine) parses pyproject via configparser and
# rejects percent characters.
[tool.poe.tasks.complexity]
cmd = "xenon src/ --max-absolute C --max-average B"
help = "Xenon complexity gate (ratchet to --max-absolute B; see comment above)"

# Needs coverage data first: run ``poe test-cov`` to generate coverage.xml,
# then ``poe cover-diff``. Kept out of ``verify`` because the plain test
# run does not produce coverage.xml.
[tool.poe.tasks.cover-diff]
cmd = "diff-cover coverage.xml --fail-under 90"
help = "Diff coverage of at least 90 percent (requires coverage.xml from poe test-cov)"

[tool.poe.tasks.test-cov]
cmd = "python -m pytest tests/ -q --cov=corpus_kb --cov-report=xml --cov-report=term-missing"
help = "Full suite with coverage.xml for the cover-diff gate"

[tool.poe.tasks.hooks]
cmd = "pre-commit run --all-files"
help = "Run the pre-commit hooks over the whole tree (config: .pre-commit-config.yaml)"

[tool.poe.tasks.test]
cmd = "python -m pytest tests/ -x -q --tb=short"
help = "Full test suite (Ollama/Postgres degrade gracefully)"

# Plain-language gate (zero-drift Wave 5A, program standard 6). The full
# suite already includes it; this target runs the gate alone.
[tool.poe.tasks.ste]
cmd = "python -m pytest tests/test_plain_language.py -m ste -q --tb=short"
help = "ASD-STE100 plain-language gate: docs grade, error strings, tool docstrings"

[tool.poe.tasks.verify]
sequence = ["lint", "lint-imports", "format-check", "types", "dead-code", "deps", "complexity", "test"]
help = "All quality gates: lint + lint-imports + format-check + types + dead-code + deps + complexity + test"

[tool.poe.tasks.gen]
# All three generators run in --check mode: exit 1 on drift, write nothing.
# To rewrite the artifacts after an edit, run the underlying scripts
# without --check (see the sub-targets below).
sequence = ["gen-harness-pack", "gen-method-docs", "ui-manifest"]
help = "Regenerate/diff-check the harness pack + method docs + UI op manifest"

[tool.poe.tasks.gen-harness-pack]
cmd = "python scripts/gen_harness_pack.py --check"
help = "Diff-check the harness command pack against surface_registry"

[tool.poe.tasks.gen-method-docs]
cmd = "python scripts/gen_method_register_docs.py --check"
help = "Diff-check docs/ANALYSIS-METHODS.md against config/analysis_methods.yaml"

[tool.poe.tasks.ui-manifest]
# The UI op manifest drift gate (UI SPA Task 4, zero-drift rule 10: poe
# target + ci.yml ui job + enforcement-map row). Needs the project deps
# (the merge reads api.research_http.tool_routes).
cmd = "python scripts/gen_ui_manifest.py --check"
help = "Diff-check the UI op manifest and generated TS artifacts"

[tool.poe.tasks.ui-manifest-write]
cmd = "python scripts/gen_ui_manifest.py"
help = "Rewrite the UI op manifest artifacts after a registry change"

[tool.poe.tasks.schema-parity]
cmd = "python scripts/schema_parity_gate.py"
help = "sqlglot schema parity across both migration sets (issue #127, rule 10)"

[tool.poe.tasks.validation-gate]
# Wave 4 validators + mode semantics + determinism (zero-drift rule 10:
# the full test pair runs here; the determinism pin lives in
# test_validate_modes). Extras stay optional — CI never installs them.
cmd = "python -m pytest tests/pipeline/ tests/ingestion/ -q --tb=short"
help = "Wave 4 ingest validator gate: validators, modes, semchunk, dedup"

[tool.poe.tasks.validate-profiles]
cmd = "python src/corpus_kb/_setup/validate_profiles.py"
help = "Profile schema + cross-reference gate (Living Corpus W5, rule 10)"

[tool.poe.tasks.license-lock]
cmd = "uv run --frozen python scripts/generate_license_lock.py"
help = "Regenerate licenses.lock.json from the pinned uv.lock environment (matches CI)"

[tool.poe.tasks.check]
sequence = ["verify", "gen"]
help = "verify + gen: everything a PR must pass locally"

# ---------------------------------------------------------------------------
# UI SPA gates (UI SPA program Task 3, zero-drift rule 8: poe target +
# CI job + map row). Node is build-time only; every target shells into
# ui_src/ through pnpm. The CI `ui` job calls the SAME targets.
# ---------------------------------------------------------------------------

[tool.poe.tasks.ui-install]
cmd = "pnpm -C ui_src install --frozen-lockfile"
help = "Install ui_src/ Node dependencies from the committed lockfile"

[tool.poe.tasks.ui-lint]
cmd = "pnpm -C ui_src lint"
help = "UI lint + types: ESLint and tsc --noEmit (strict, no any)"

[tool.poe.tasks.ui-test]
cmd = "pnpm -C ui_src test"
help = "UI unit tests (vitest)"

[tool.poe.tasks.ui-build]
cmd = "pnpm -C ui_src build"
help = "Build the SPA into src/corpus_kb/ui_dist/ (Vite, base /app/)"

[tool.poe.tasks.ui-bundle]
# Fails when any initial-route gzip chunk or the total passes 350 kB
# (ui_src/scripts/check-bundle.mjs; also runs inside ui-build).
cmd = "pnpm -C ui_src run check-bundle"
help = "UI initial-route bundle budget gate (350 kB gzip)"

[tool.poe.tasks.ui-e2e]
# SPA Playwright smoke + axe scan against a REAL throwaway server
# (Task 9): scripts/ui_e2e.py boots corpus-kb on a scratch database
# (tests/research_db.py recipe), preloads the demo corpus, runs
# ui_src/e2e, and tears both down. Needs: Postgres, the venv console
# script, pnpm, and the chromium browser (pnpm -C ui_src exec playwright
# install chromium).
cmd = "python scripts/ui_e2e.py"
help = "SPA e2e smoke + a11y scan on a live throwaway server"

[tool.poe.tasks.ui-licenses]
# Real gate (Task 4): production deps stay on the MIT / Apache-2.0 / BSD /
# ISC / 0BSD allowlist; the lock records the production tree only (dev
# trees are platform-specific). --check exits 1 on drift.
cmd = "python scripts/ui_licenses.py --check"
help = "UI production-license allowlist gate (writes ui_licenses.lock.json)"

[tool.poe.tasks.ui-licenses-write]
cmd = "python scripts/ui_licenses.py"
help = "Rewrite ui_licenses.lock.json after a dependency change"

# ---------------------------------------------------------------------------
# Import layering (Wave 2, program standard 5). The ASPIRATIONAL ladder is
# api -> tools -> handlers -> storage, but the live graph also runs
# handlers -> tools (command_handler delegates ingest to the tool layer by
# design) and cli -> tools, so the enforced contracts below pin the edges
# that are true today and would catch a shadow pipeline:
#   * nothing under tools/ or handlers/ may import the api adapters;
#   * the gateway layer stays bootstrap-free: storage never imports the
#     _setup installer (that is why _setup.migrate carries its own
#     duckdb_dsn_to_path copy of the DSN convention);
#   * handlers -> _setup stays the SANCTIONED bootstrap edge (apply_schema,
#     the migration runner — lazy imports in migrate_stream/migrate_roundtrip),
#     so it must NOT be forbidden here;
#   * the contracts catalogue stays stdlib-light (no surface imports).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "corpus_kb"

[[tool.importlinter.contracts]]
name = "tools must not import api"
type = "forbidden"
source_modules = ["corpus_kb.tools"]
forbidden_modules = ["corpus_kb.api"]

[[tool.importlinter.contracts]]
name = "handlers must not import api"
type = "forbidden"
source_modules = ["corpus_kb.handlers"]
forbidden_modules = ["corpus_kb.api"]

[[tool.importlinter.contracts]]
name = "storage must not import the installer"
type = "forbidden"
source_modules = ["corpus_kb.storage"]
forbidden_modules = ["corpus_kb._setup"]

[[tool.importlinter.contracts]]
name = "contracts must not import surfaces or pipeline packages"
type = "forbidden"
source_modules = ["corpus_kb.contracts"]
forbidden_modules = [
    "corpus_kb.api",
    "corpus_kb.tools",
    "corpus_kb.handlers",
    "corpus_kb.storage",
    "corpus_kb.cli",
]

[project.scripts]
corpus-kb = "corpus_kb.cli:app"

# Third-party ingestion-strategy plugin group (plan Section 0, ladder #3).
# Intentionally EMPTY here: the built-in strategies (default, transcript)
# register directly in code (corpus_kb.ingestion.registry._ensure_ready).
# A downstream package declares its strategies under this group and
# corpus-kb discovers them at ingest time; a broken plugin is logged and
# skipped, never fatal.
[project.entry-points."corpus_kb.ingestion_strategies"]

[tool.commitizen]
# Customized Conventional Commits driver. The `cz_customize` plugin reads
# the schema pattern and change type map from the `[tool.commitizen.customize]`
# table below, which is intentionally tightened to the same prefix set
# enforced by .github/workflows/commit-validate.yml. Keeping the two in
# lockstep means a commit that passes `cz check` will also pass the
# PR-time validator (and vice versa).
name = "cz_customize"
# Read/write the project version from PEP 621 [project] metadata.
version_provider = "pep621"
version_files = ["pyproject.toml"]
# Tag published releases as vX.Y.Z.
tag_format = "v$version"
# Keep the CHANGELOG in sync with bumped versions.
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

# `cz_customize` requires a populated `[tool.commitizen.customize]` table.
# The schema pattern mirrors the regex used by commit-validate.yml so both
# validators accept the same set of commit messages. The change type map
# drives the section titles rendered in CHANGELOG.md.
[tool.commitizen.customize]
# Allowed commit types: feat, fix, docs, chore, test, refactor, perf.
# Deliberately excludes build, ci, style, revert, bump, improvement.
# The schema pattern uses TOML escape doubling (e.g. `\\(S+)`) so the
# regex that commitizen eventually evaluates contains literal `\(`, `\)`,
# and `\S` tokens.
schema_pattern = '(?s)(feat|fix|docs|chore|test|refactor|perf)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'
bump_pattern = '^((BREAKING[\-\ ]CHANGE|feat|fix|perf|refactor)(\(.+\))?!?):'
bump_map = { "BREAKING CHANGE" = "MAJOR", "BREAKING-CHANGE" = "MAJOR", feat = "MINOR", fix = "PATCH", perf = "PATCH", refactor = "PATCH" }
change_type_map = { feat = "Features", fix = "Bug Fixes", perf = "Performance", refactor = "Refactors", docs = "Documentation", test = "Tests", chore = "Chores" }
message_template = "{{type}}({{scope}}): {{subject}}"
schema = "<type>(<scope>): <subject>\n\n<body>\n\n<footer>"
