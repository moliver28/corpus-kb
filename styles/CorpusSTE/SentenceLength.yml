# ASD-STE100: keep sentences short. The zero-drift program binds 20 words.
# Canonical Vale sentence-length recipe: occurrence over sentence scope,
# counting WORDS (\b\S+\b), alerting above `max`.
#
# Level: error. Ratchet complete: the w6a pass measured 163 violations,
# rewrote them to 0 across README.md + docs/*.md prose, and flipped this
# rule on 2026-10-13. The rule now blocks PRs on any sentence over 20
# words. The Python-half gate (quickstart sentences <= 30 words, FK grade
# <= 12) lives in tests/test_plain_language.py.
extends: occurrence
scope: sentence
level: error
message: "Keep sentences to 20 words or fewer (ASD-STE100). Split this one."
max: 20
token: '\b\S+\b'
