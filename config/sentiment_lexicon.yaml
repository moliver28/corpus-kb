# Sentiment lexicon (the analysis-method-register program).
#
# A curated preset composition: common English words only, no proper
# nouns, no domain jargon. The two lists MUST stay disjoint — a word on
# both lists would vote twice in the labeling-function screen.
#
# This is NOT a trained sentiment model. Negation, sarcasm, and domain
# shift are all unhandled; read the evidence note in the
# sentiment_screen envelope before use.
