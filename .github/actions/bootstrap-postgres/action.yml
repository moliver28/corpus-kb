# Composite action: Postgres service bootstrap (momus F12).
#
# Single source for the extensions+schema bootstrap that the test-ubuntu
# leg and the warning-ratchet leg of ci.yml used to carry as two verbatim
# copies. The service container starts EMPTY: initdb creates corpus_kb but
# nothing applies the schema, so every live-Postgres test would fail with
# "relation ... does not exist". Prepare it with the repo's own bootstrap
# (corpus_kb._setup.schema_apply — the same code the quickstart and
# tests/research_db.py use):
#   1. extensions the migrations need (pgvector/uuid-ossp) plus age/pgml,
#      which this bundled image ships;
#   2. the corpus_kb graph created with Apache AGE's LOAD + search_path
#      ritual (upstream apache/age#2504, pinned 1.7.0~rc0: create_graph
#      resolves the graphid_ops operator class through the caller's
#      search_path, and fails with a misleading "graphid_ops does not
#      exist" without it);
#   3. storage/schema.sql + numbered migrations. The extension-gated
#      004/005 are skipped here by design; the durable effects above make
#      them re-apply as recorded no-ops when tests run the migration
#      runner.
# Idempotent throughout, so re-running a failed job is safe.
#
# Requires: actions/checkout and the locked environment (uv sync with the
# .venv bin dirs on GITHUB_PATH) must have run before this action, so
# `python` sees asyncpg and corpus_kb.
name: "Bootstrap service database (extensions + schema)"
description: >
  Create the pgvector/uuid-ossp/age/pgml extensions, the corpus_kb AGE
  graph, and apply the corpus_kb schema on the Postgres service container.

inputs:
  dsn:
    description: "DSN of the service database to bootstrap."
    required: false
    default: "postgresql://corpus_user:corpus_pass@localhost:5432/corpus_kb"

runs:
  using: "composite"
  steps:
    - name: Bootstrap service database (extensions + schema)
      shell: bash
      env:
        BOOTSTRAP_DSN: ${{ inputs.dsn }}
      run: |
        python - <<'PY'
        import asyncio
        import os

        import asyncpg

        from corpus_kb._setup.schema_apply import apply_schema

        DSN = os.environ["BOOTSTRAP_DSN"]

        async def main() -> None:
            conn = await asyncpg.connect(DSN)
            try:
                await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                await conn.execute('CREATE EXTENSION IF NOT EXISTS "uuid-ossp"')
                await conn.execute("CREATE EXTENSION IF NOT EXISTS age")
                await conn.execute("CREATE EXTENSION IF NOT EXISTS pgml")
                await conn.execute("LOAD 'age'")
                await conn.execute('SET search_path = ag_catalog, "$user", public')
                has_graph = await conn.fetchval(
                    "SELECT 1 FROM ag_catalog.ag_graph WHERE name = 'corpus_kb'"
                )
                if not has_graph:
                    await conn.execute("SELECT ag_catalog.create_graph('corpus_kb')")
            finally:
                await conn.close()
            result = await apply_schema(DSN)
            print("schema bootstrap applied:", len(result.applied))
            print("skipped (extension-gated):", result.skipped)

        asyncio.run(main())
        PY
