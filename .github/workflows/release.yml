# Release pipeline for Corpus-KB
#
# Publishes the corpus-kb package with Trusted Publishing (OIDC).
# No long-lived PyPI API token is stored in GitHub.
#
# Trigger: publishing a GitHub release.
#   - Prerelease (e.g. v0.1.0rc1) -> TestPyPI (dry run for the real thing)
#   - Final release               -> PyPI
#
# Index-side prerequisite: before the first run, add a pending trusted
# publisher on each index, pointing at this workflow:
#   - https://test.pypi.org  (project: corpus-kb)
#   - https://pypi.org       (project: corpus-kb)
# Required publisher settings (identical on both):
#   - Publisher: GitHub
#   - Repository: moliver28/corpus-kb
#   - Workflow name: release.yml
#   - Environment: testpypi (on TestPyPI) / pypi (on PyPI)
# The GitHub environments `testpypi` and `pypi` must also exist in this repo
# (created 2026-10-08 via API).

name: Release

on:
  release:
    types: [published]

jobs:
  publish-testpypi:
    name: Publish to TestPyPI (prerelease)
    if: github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: false

  publish-pypi:
    name: Publish to PyPI (final)
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: false
