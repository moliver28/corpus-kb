# Release pipeline for Corpus-KB
#
# Publishes the corpus-kb package to PyPI using Trusted Publishing (OIDC).
# No long-lived PyPI API token is stored in GitHub.
#
# Trigger: publishing a GitHub release. The workflow builds a wheel and sdist
# with `python -m build`, then uploads them to PyPI via the official
# pypa/gh-action-pypi-publish action.
#
# PyPI-side prerequisite: a repository admin must add a pending trusted
# publisher in the corpus-kb PyPI project before this workflow can succeed.
# Required publisher settings:
#   - Publisher: GitHub
#   - Repository: moliver28/corpus-kb
#   - Workflow name: release.yml
#   - Environment: pypi

name: Release

on:
  release:
    types: [published]

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: false
