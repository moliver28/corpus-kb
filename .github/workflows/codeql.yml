name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
          # The plugin tree (plugins/corpus-rag, issue 331) stays outside
          # every engine scanner: it keeps its own conventions and has its
          # own CI job. Without this exclude, the imported plugin (issue 331
          # step 1) would open untriaged code-scanning alerts that can red
          # the PR. init@v3 takes path config through the inline `config`
          # input (same format as a config file); it has no direct
          # paths-ignore input.
          config: |
            paths-ignore:
              - "plugins/**"

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
