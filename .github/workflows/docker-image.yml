# Build and publish the pinned PostgreSQL image for Corpus-KB.
#
# Publishes ghcr.io/moliver28/corpus-kb-postgres with one tag per run:
#   * edge-pg17     - rolling tag, moved by master pushes and dispatches
#   * X.Y.Z-pg17    - immutable tag, derived from the pushed v* tag
#
# A master push never writes a version-shaped tag. A version push never
# moves a rolling tag. Consumers pin immutable tags; CI pulls 0.1.0-pg17,
# so that tag must never be rewritten.
#
# Triggers:
#   * workflow_dispatch  - on-demand rebuilds (rolling edge-pg17)
#   * push to master     - keeps the rolling edge-pg17 tag fresh after merges
#   * version tags (v*)  - immutable revision tags (X.Y.Z-pg17)
# There is NO pull_request trigger: image builds never run on PR CI.
#
# Multi-platform strategy: each architecture builds NATIVELY on its own
# runner (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and pushes an
# untagged image by digest; a merge job then stitches the per-platform
# digests into a single multi-arch manifest list. This avoids QEMU
# emulation entirely - emulating the PostgresML build (Python PGO + Rust
# release compile) takes many hours and can exceed the 6h job cap, and the
# 10GB LRU Actions cache is too small to keep the emulated layers warm.
name: Build Postgres image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moliver28/corpus-kb-postgres

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (provenance labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
          build-args: |
            PGVECTOR_VERSION=0.8.6-1.pgdg12+2
            AGE_VERSION=1.7.0~rc0-1.pgdg12+1
            POSTGRESML_VERSION=2.10.0
            PGRX_VERSION=0.12.9

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and push tags
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the publish tag
        run: |
          # A version push makes one immutable tag from the pushed tag.
          # Everything else (master push, dispatch) moves the rolling tag.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ -z "$VERSION" ]]; then
              echo "FAIL: Version tag '$GITHUB_REF_NAME' has no version after the v prefix."
              exit 1
            fi
            echo "PUBLISH_TAG=${VERSION}-pg17" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_TAG=edge-pg17" >> "$GITHUB_ENV"
          fi

      - name: Extract image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PUBLISH_TAG }}

      - name: Create and push multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t \(.)") | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)
