name: License baseline check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The lock is generated from the uv.lock environment: exact pinned
      # versions from a universal resolve, reproducible on any machine.
      # A floating `pip install -e .` resolve drifted whenever any transitive
      # dependency published a release, which forced this workflow to commit
      # bot heads whose own checks can never run.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync the exact locked environment
        run: uv sync --frozen

      - name: Regenerate the license lock from the locked environment
        run: uv run --frozen python scripts/generate_license_lock.py

      # Check, never commit: a GITHUB_TOKEN push cannot run the checks on
      # its own head, which left PRs blocked until a human pushed again.
      # Drift means a real dependency change; fix it with a normal commit.
      - name: Fail on drift with the fix command
        run: |
          if git diff --quiet licenses.lock.json; then
            echo "License lock is current."
            exit 0
          fi
          echo "::error::licenses.lock.json drifted from the uv.lock environment."
          echo "Fix locally, then commit the result to this branch:"
          echo "  uv run --frozen python scripts/generate_license_lock.py"
          echo "  (or: poe license-lock)"
          git diff licenses.lock.json
          exit 1
