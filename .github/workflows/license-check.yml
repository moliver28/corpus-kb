name: License baseline check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: write

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The job pushes the regenerated lock back to the PR branch.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the head ref so the push lands on the PR branch.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match ci.yml's interpreter: the lock depends on the Python
          # version pip resolves for (a 3.12 local venv drifts from a 3.11 CI
          # resolve, which failed this check in both directions).
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Regenerate the license lock in this exact environment
        run: python scripts/generate_license_lock.py

      - name: Commit the lock if it moved; fail only on real errors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet licenses.lock.json; then
            echo "License lock is current."
            exit 0
          fi
          git add licenses.lock.json
          git commit -m "chore: Regenerate license lock to match CI resolution"
          git push
          echo "License lock drifted; regenerated and pushed. A new run starts on the push."
