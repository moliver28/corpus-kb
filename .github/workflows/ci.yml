# CI Pipeline for Corpus-KB
#
# Architecture note: The git repo root now contains a SINGLE source tree:
#   src/          — active development tree (ALL CI paths point here)
#
# Every CI command in this workflow runs from the repo root. The legacy
# nested corpus-kb subdirectory has been removed. See PR-1 of the
# installation-ux-ci-quality-overhaul for details.
#
# CI Gate Order: lint → type-check → validate-configs → test (3 OSes)
# Tests depend on validate-configs passing. fail-fast: false so all OS
# results are visible even if one fails. The test legs split at phase B of
# the storage portability program (issue #127, rule 20): ubuntu carries the
# Postgres service container (Linux-only), windows/macos run without it.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  OLLAMA_MODEL: "nomic-embed-text"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint: ruff check + format check (fast, ~10s, no deps needed)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: "lint (ruff)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff==0.15.18

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      # Zero-drift enforcement-map rows (Wave 3+6): dead code, dependency
      # hygiene, and the complexity ratchet. deptry needs the project env
      # to map import names to packages (pptx -> python-pptx), so the
      # project installs here too.
      - name: Install project and quality gates
        run: |
          pip install -e ".[dev]"
          pip install vulture deptry xenon

      - name: Dead code (vulture)
        run: vulture src/ tests/whitelist.py

      # Import layering contracts (Wave 2, zero-drift rule 5). Needs the
      # project env: grimp resolves corpus_kb through the editable install.
      - name: Import layering (lint-imports)
        run: lint-imports

      - name: Dependency hygiene (deptry)
        run: deptry src/

      - name: Complexity ratchet (xenon)
        run: xenon src/ --max-absolute C --max-average B

      # Schema parity across both migration sets (storage portability
      # program, issue #127, zero-drift rule 10). sqlglot is static-only;
      # undeclared column/PK/unique/FK/sequence/index drift fails the PR.
      - name: Schema parity gate (sqlglot)
        run: python scripts/schema_parity_gate.py

  # ─────────────────────────────────────────────────────────────────────
  # Type-check: pyright in basic mode (warnings downgraded, see
  # pyrightconfig.json for which rules are warnings vs errors)
  #
  # Project deps are installed so pyright can resolve imports like
  # pydantic, ollama, lancedb, etc. Without this, pyright reports
  # false-positive "reportMissingImports" errors.
  # ─────────────────────────────────────────────────────────────────────
  type-check:
    name: "type-check (pyright)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pyright and project deps
        # Project deps are needed so pyright can resolve third-party imports.
        # Without this, pyright reports 147+ false-positive missing-import errors.
        # The duckdb extra is REQUIRED here from the first `import duckdb`
        # commit onward (storage portability program, §11 rule 1): CI never
        # sees an unresolvable import.
        run: |
          pip install pyright
          pip install -e ".[dev,duckdb]"

      - name: Pyright type check
        # pyrightconfig.json in the repo root downgrades pre-existing type
        # issues to warnings:
        #   reportAttributeAccessIssue, reportCallIssue,
        #   reportArgumentType, reportReturnType → "warning"
        run: pyright src/

      # Profile truth gate (Living Corpus W5, rule 10): every shipped
      # profile must name live strategies, real template ids, and an
      # existing seeds file. Needs the package importable, so it rides
      # the type-check job (project deps are already installed).
      - name: Validate profiles
        run: python src/corpus_kb/_setup/validate_profiles.py

  # ─────────────────────────────────────────────────────────────────────
  # Validation gate (unified-ingestion Wave 4, zero-drift rule 10): the
  # ingest validators, the off/advisory/enforce/calibrate mode semantics,
  # and the semchunk/dedup lazy seams. Runs through poe (rule 8). The
  # extras stay UNINSTALLED: the extras-less contract is itself under
  # test here.
  # ─────────────────────────────────────────────────────────────────────
  validation-gate:
    name: "validation-gate"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install poethepoet and project deps (extras NOT installed)
        run: |
          pip install poethepoet
          pip install -e ".[dev]"

      - name: Validation gate
        run: poe validation-gate

  # ─────────────────────────────────────────────────────────────────────
  # Validate-configs: checks MCP config JSON files for format correctness
  # and cross-config consistency. Fast, no deps needed beyond stdlib.
  # ─────────────────────────────────────────────────────────────────────
  validate-configs:
    name: "validate-configs"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Runtime config validation (extraction.gliner lockstep etc.) parses
      # YAML; this fast gate deliberately skips the full project install.
      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Validate config files
        run: python src/corpus_kb/_setup/validate_configs.py

  # ─────────────────────────────────────────────────────────────────────
  # Verify Postgres image: pull the pinned GHCR image and smoke-test that
  # the extensions (pgvector, AGE, PostgresML) load successfully. This is
  # a fast pull+run check; it does NOT rebuild the image on PRs.
  # ─────────────────────────────────────────────────────────────────────
  verify-postgres-image:
    name: "verify-postgres-image"
    runs-on: ubuntu-latest

    steps:
      - name: Pull Postgres image
        run: docker pull ghcr.io/moliver28/corpus-kb-postgres:0.1.0-pg17

      - name: Start Postgres container
        run: |
          docker run -d --name corpus-kb-postgres \
            -e POSTGRES_USER=corpus_user \
            -e POSTGRES_PASSWORD=corpus_pass \
            -e POSTGRES_DB=corpus_kb \
            -p 5433:5432 \
            ghcr.io/moliver28/corpus-kb-postgres:0.1.0-pg17

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            if docker exec corpus-kb-postgres pg_isready -U corpus_user -d corpus_kb; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for Postgres..."
            sleep 1
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Dump container logs (diagnostics)
        if: failure()
        run: docker logs corpus-kb-postgres || true

      - name: Verify extensions load
        run: |
          docker exec corpus-kb-postgres \
            psql -U corpus_user -d corpus_kb -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS age; CREATE EXTENSION IF NOT EXISTS pgml;"

      - name: Stop and remove Postgres container
        if: always()
        run: docker rm -f corpus-kb-postgres

  # ─────────────────────────────────────────────────────────────────────
  # UI: the lifecycle SPA (ui_src/) — React 19 + Vite, Node build-time
  # only. pnpm is installed DIRECTLY (pnpm/action-setup standalone
  # installer), never via corepack (corepack is leaving Node
  # distributions; it must not be a load-bearing step). The gates run
  # through poe (rule 8: one source of gate commands) — only poethepoet
  # is needed because the ui-* targets shell into pnpm, not the project.
  # The built ui_dist/ ships as an artifact; the Python package includes
  # it via package-data.
  # ─────────────────────────────────────────────────────────────────────
  ui:
    name: "ui (spa build gates)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poethepoet
        # The ui-* poe targets call pnpm; the manifest gate additionally
        # reads the Python api layer, so the project installs below.
        run: pip install poethepoet

      - name: Install project (manifest gate reads the api layer)
        run: pip install -e .

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ui_src/.nvmrc
          cache: pnpm
          cache-dependency-path: ui_src/pnpm-lock.yaml

      - name: UI install (frozen lockfile)
        run: poe ui-install

      - name: UI lint
        run: poe ui-lint

      - name: UI test
        run: poe ui-test

      - name: UI build
        run: poe ui-build

      - name: UI manifest drift check
        run: poe ui-manifest

      - name: UI bundle size gate
        run: poe ui-bundle
      - name: UI licenses allowlist
        run: poe ui-licenses

      - name: Upload ui_dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui_dist
          path: src/corpus_kb/ui_dist

  # ─────────────────────────────────────────────────────────────────────
  # Test: Postgres service leg (ubuntu) + cross-OS matrix (windows, macos)
  #
  # Split into two jobs because GitHub service containers are Linux-only
  # (macOS runners have no Docker; Windows does not support service
  # containers). Program rule 20: the Postgres service rides the ubuntu
  # test leg ONLY, using the pinned bundled GHCR image — stock postgres:17
  # lacks the pgvector/AGE/PostgresML extensions the migrations require
  # (see the verify-postgres-image job). The live `requires_postgres`
  # marks burn in on this leg; windows/macos keep auto-skipping Postgres.
  #
  # Ollama install strategy per OS:
  #   Ubuntu:  curl | sh (works reliably)
  #   macOS:   brew install ollama (curl | sh fails on macOS runners)
  #   Windows: OllamaSetup.exe /S with 120s timeout + continue-on-error
  #            (silent installer often hangs on GitHub Actions Windows runners)
  #
  # Windows-specific fixes:
  #   - python-magic-bin installed to fix "access violation" crash from
  #     the `magic` library (unstructured dependency needs libmagic binary)
  #   - continue-on-error on Ollama install/pull/verify so tests can run
  #     in degraded mode (zero-vector fallback) when Ollama is unavailable
  #
  # Test steps:
  #   - ubuntu timeout-minutes: 20 (rule 20: the live Postgres marks need
  #     the higher ceiling) — cross-OS legs keep 10 (hang protection)
  # ─────────────────────────────────────────────────────────────────────
  test-ubuntu:
    name: "test (ubuntu, postgres service)"
    runs-on: ubuntu-latest
    needs: [validate-configs]

    services:
      postgres:
        image: ghcr.io/moliver28/corpus-kb-postgres:0.1.0-pg17
        env:
          POSTGRES_USER: corpus_user
          POSTGRES_PASSWORD: corpus_pass
          POSTGRES_DB: corpus_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corpus_user -d corpus_kb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CORPUS_KB_DATABASE_URL: postgresql://corpus_user:corpus_pass@localhost:5432/corpus_kb
      # tests/research_db.py derives its DSNs from these; the values mirror
      # the service env above (program rule 20 wiring). In the bundled image
      # the bootstrap role (corpus_user) IS the superuser.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: corpus_user
      POSTGRES_PASSWORD: corpus_pass
      POSTGRES_DB: corpus_kb
      POSTGRES_SUPERUSER: corpus_user
      POSTGRES_SUPERUSER_PASSWORD: corpus_pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: Install dependencies
        # Rule 1 (storage portability program): the extra ships from the
        # first `import duckdb` commit onward.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,duckdb]"

      - name: Warm the DuckDB extension cache (fts, vss, postgres)
        # The gateway loads DuckDB extensions with autoinstall off, so the
        # per-platform cache under ~/.duckdb/extensions must be warmed
        # before any test LOADs fts or vss. The installed duckdb wheel pins
        # the version, so the cache key always matches.
        run: python -c "import duckdb; con = duckdb.connect(); [con.execute('INSTALL ' + name) for name in ('fts', 'vss', 'postgres')]; con.close()"

      - name: Bootstrap service database (extensions + schema)
        # Workflow note: this job was single-owner (sp-gateway); the storage
        # portability integrator touched it in Phase B to add this step.
        #
        # The service container starts EMPTY: initdb creates corpus_kb but
        # nothing applies the schema, so every live-Postgres test would fail
        # with "relation ... does not exist". Prepare it with the repo's own
        # bootstrap (corpus_kb._setup.schema_apply — the same code the
        # quickstart and tests/research_db.py use):
        #   1. extensions the migrations need (pgvector/uuid-ossp) plus
        #      age/pgml, which this bundled image ships;
        #   2. the corpus_kb graph created with Apache AGE's LOAD +
        #      search_path ritual (upstream apache/age#2504, pinned
        #      1.7.0~rc0: create_graph resolves the graphid_ops operator
        #      class through the caller's search_path, and fails with a
        #      misleading "graphid_ops does not exist" without it);
        #   3. storage/schema.sql + numbered migrations. The extension-gated
        #      004/005 are skipped here by design; the durable effects above
        #      make them re-apply as recorded no-ops when tests run the
        #      migration runner.
        # Idempotent throughout, so re-running a failed job is safe.
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg

          from corpus_kb._setup.schema_apply import apply_schema

          DSN = "postgresql://corpus_user:corpus_pass@localhost:5432/corpus_kb"

          async def main() -> None:
              conn = await asyncpg.connect(DSN)
              try:
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  await conn.execute('CREATE EXTENSION IF NOT EXISTS "uuid-ossp"')
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS age")
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS pgml")
                  await conn.execute("LOAD 'age'")
                  await conn.execute('SET search_path = ag_catalog, "$user", public')
                  has_graph = await conn.fetchval(
                      "SELECT 1 FROM ag_catalog.ag_graph WHERE name = 'corpus_kb'"
                  )
                  if not has_graph:
                      await conn.execute("SELECT ag_catalog.create_graph('corpus_kb')")
              finally:
                  await conn.close()
              result = await apply_schema(DSN)
              print("schema bootstrap applied:", len(result.applied))
              print("skipped (extension-gated):", result.skipped)

          asyncio.run(main())
          PY

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          # The live legs exercise all three: nomic-embed-text (legacy
          # default), qwen3-embedding:4b (the shipped config.yaml default),
          # and qwen3-embedding:8b-q8_0 (the 4096-dim MRL-slice proof).
          key: ollama-nomic-embed-text-qwen3-4b-qwen3-8b-${{ runner.os }}

      - name: Install Ollama (Ubuntu)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Pull embedding models
        # continue-on-error: tests that can degrade to zero-vector fallback
        # still run when a pull fails; live-model tests (research embed
        # proof) fail loudly instead, which is the honest signal.
        continue-on-error: true
        run: |
          ollama pull nomic-embed-text
          ollama pull qwen3-embedding:4b
          ollama pull qwen3-embedding:8b-q8_0

      - name: Verify Ollama
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Attempt $i/10: Waiting for Ollama..."
            sleep 1
          done

      - name: Run tests
        # timeout-minutes: 20 — rule 20 requires >= 20 min on the ubuntu leg
        # now that the live Postgres marks execute here. Still caps any hang.
        timeout-minutes: 20
        run: python -m pytest tests/ -v --tb=short --durations=10 --cov=corpus_kb --cov-report=term-missing

  test-cross:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: [validate-configs]
    env:
      # No Postgres service exists on these runners; requiring tests probe
      # this URL, find it unreachable, and auto-skip.
      CORPUS_KB_DATABASE_URL: postgresql://corpus_user:corpus_pass@localhost:5433/corpus_kb
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # shell: bash ensures the if-statement works on all OSes (Windows
        # defaults to powershell which has different if-syntax)
        # python-magic-bin provides the libmagic DLL that the `unstructured`
        # package needs on Windows. Without it, Python crashes with
        # "Windows fatal exception: access violation" in magic.compat.py.
        # --force-reinstall --no-deps keeps its `magic` module winning the
        # file race against the pure python-magic package: both ship a
        # `magic/` package, and the dev-group dependency can unpack
        # python-magic-bin BEFORE pip unpacks python-magic, leaving the
        # DLL-less loader in place (observed 2026-10-25).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,duckdb]"
          if [ "$RUNNER_OS" = "Windows" ]; then pip install --force-reinstall --no-deps python-magic-bin==0.4.14; fi
        shell: bash

      - name: Warm the DuckDB extension cache (fts, vss, postgres)
        # Same rationale as the ubuntu leg: the gateway loads extensions
        # with autoinstall off, so each runner platform needs its own
        # pre-warmed cache before a test LOADs fts or vss.
        run: python -c "import duckdb; con = duckdb.connect(); [con.execute('INSTALL ' + name) for name in ('fts', 'vss', 'postgres')]; con.close()"

      - name: Install libmagic (macOS)
        # Binary-safe ingest detects unknown file formats through libmagic.
        # Ubuntu has the system package and Windows gets python-magic-bin
        # above, but macOS runners ship without it. Without it, unstructured
        # cannot partition binary blobs and the ingest surfaces return an
        # error envelope instead of success.
        if: runner.os == 'macOS'
        run: brew install libmagic

      - name: Cache Ollama models (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ format('{0}\ollama\models', env.APPDATA) }}
          key: ollama-${{ env.OLLAMA_MODEL }}-${{ runner.os }}

      - name: Install Ollama (macOS)
        # brew install is used instead of curl | sh because the install.sh
        # script fails on GitHub Actions macOS runners (exit code 1).
        # See RCA: .omo/plans/ci-rca.md
        if: runner.os == 'macOS'
        run: |
          brew install ollama
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Install Ollama (Windows)
        # continue-on-error: true because the OllamaSetup.exe silent
        # installer (/S) frequently hangs or fails on GitHub Actions Windows
        # runners. When it fails, tests run in degraded mode
        # (OllamaEmbedder catches ConnectionError and returns zero vectors).
        #
        # The 120s Wait-Process timeout prevents indefinite hangs. If the
        # installer hasn't finished in 2 minutes, we kill it and proceed.
        # GITHUB_PATH is set so subsequent steps can find ollama.exe.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Installing Ollama on Windows..."
          $ProgressPreference = 'SilentlyContinue'
          $OllamaDir = "C:\Users\$env:USERNAME\AppData\Local\Programs\Ollama"
          New-Item -ItemType Directory -Path $OllamaDir -Force | Out-Null
          try {
            Invoke-WebRequest -Uri "https://ollama.com/download/OllamaSetup.exe" -OutFile "OllamaSetup.exe" -ErrorAction Stop
            $proc = Start-Process -FilePath "OllamaSetup.exe" -ArgumentList "/S" -PassThru -ErrorAction Stop
            $proc | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
            if (-not $proc.HasExited) { $proc.Kill() }
          } catch {
            Write-Host "Ollama install failed: $_"
          }
          if (Test-Path "$OllamaDir\ollama.exe") {
            echo "$OllamaDir" >> $env:GITHUB_PATH
            Start-Process -FilePath "$OllamaDir\ollama.exe" -ArgumentList "serve" -WindowStyle Hidden
            Start-Sleep -Seconds 5
          } else {
            Write-Host "Ollama not installed, tests will run in degraded mode"
          }

      - name: Pull embedding model
        # continue-on-error: true because ollama may not be installed
        # (Windows install may have failed). Tests use zero-vector
        # fallback when the model is unavailable.
        continue-on-error: true
        run: ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Verify Ollama (macOS)
        if: runner.os == 'macOS'
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Attempt $i/10: Waiting for Ollama..."
            sleep 1
          done

      - name: Verify Ollama (Windows)
        # continue-on-error: true — if Ollama isn't running, tests
        # proceed in degraded mode (zero-vector embeddings)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $maxAttempts = 10
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:11434/api/tags" -ErrorAction Stop
              Write-Host "Ollama is ready"
              exit 0
            } catch {
              if ($i -lt $maxAttempts) {
                Write-Host "Attempt $i/$maxAttempts: Waiting for Ollama..."
                Start-Sleep -Seconds 1
              } else {
                Write-Host "Ollama not responding, tests will run in degraded mode"
                exit 1
              }
            }
          }

      - name: Run tests
        # timeout-minutes prevents hung Ollama connection attempts from
        # blocking CI indefinitely (Windows TCP timeout can be 21s+ per
        # attempt × multiple embed calls). 40 min: the hardening round's
        # suite outgrew the old 15-minute line on windows (ubuntu needs
        # 24 min with the same tests), and PYTHONUNBUFFERED keeps the
        # per-test progress visible instead of trapped in the pipe buffer
        # until the process dies — without it a slow leg looks identical
        # to a hang.
        timeout-minutes: 40
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest tests/ -v --tb=short --durations=10 --cov=corpus_kb --cov-report=term-missing
