# Weekly security triage bot.
#
# Complements, does not duplicate: codeql.yml already runs the CodeQL
# analysis on a Sunday schedule (plus push/PR), and dependency-audit.yml
# already re-runs the PR audit-deps gate every Monday 06:00 UTC. What
# neither does is file ONE consolidated, human-readable triage issue per
# run. This bot runs the audit-deps gate itself (cheap, authoritative),
# READS the open CodeQL alerts through the API instead of re-running
# the analysis, and files or updates exactly one issue labeled
# security-triage + dept:engineering.
#
# Issue pattern (reopen-or-update): while an open security-triage issue
# exists, each run appends its report as a comment; when none is open,
# a run with findings or scanner limits files a new one. A clean run
# with no open issue stays silent. Closing the issue ends the thread;
# the next findings run opens a fresh one. One report per run — never
# one per finding.
#
# Report-PR pattern (owner override 2026-11-27, #513/#512): the run's
# report ALSO batches into ONE auto-PR. The PR carries the run's dated
# report file (docs/security/triage/<date>.md) on the fixed
# chore/security-triage-report branch, and its body holds the latest
# report — the human triage surface. While that PR is open, each run
# stacks the new dated report file on the branch and refreshes the
# body; when none is open, a run with findings or scanner limits opens
# one. A clean run with no open report PR stays silent. Merge or close
# ends the thread; the next findings run opens a fresh one. The PR is
# created and edited with the RELEASE_PAT token (the changelog.yml
# token approach), so its checks run natively.
#
# Still NO auto-fixes, by design: the owner sanctioned REPORT batching
# only. The PR carries the report file and nothing else. Mechanical
# dismissal is not sanctioned (mimosa ledger rules), so triage stays
# human-in-the-loop.
#
# Rule-10 ruling: this is a scheduled REPORTER, not a merge gate. It
# adds no poe target, no CI job, and no enforcement-map row — the same
# class as dependency-audit.yml's informational legs. It never runs on
# PRs and gates nothing. Manual runs: workflow_dispatch.
#
# Skip-honest: a scanner that cannot run reports the limitation in the
# triage issue, the report PR body, and stays green. Unknown findings
# are reported as unknown, never as clean. A clean run with no open
# triage issue and no open report PR stays silent.
name: Security triage (weekly)

on:
  schedule:
    # Mondays 07:00 UTC — after dependency-audit.yml (06:00) and the
    # Sunday CodeQL run; off-peak for the repo's US owners (11 PM
    # Pacific Sunday).
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  # contents: write lets github.token push the report branch. The PR
  # create and edit ride the RELEASE_PAT token instead. issues: write
  # covers the triage issue; pull-requests: write covers the report PR
  # surface; security-events: read stays read-only.
  contents: write
  issues: write
  pull-requests: write
  security-events: read

concurrency:
  # One run at a time repo-wide: the schedule and manual dispatch both
  # touch the same triage issue, so runs queue instead of racing.
  group: security-triage
  cancel-in-progress: false

jobs:
  triage:
    name: "Collect findings, file one triage issue"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (same pin as the audit gates)
        # Same pin as the audit-deps job in ci.yml and the weekly
        # dependency-audit.yml: uv audit is a preview feature, so the
        # audit jobs pin an exact uv version and move it deliberately.
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          version: "0.13.8"

      - name: Install poethepoet
        run: uv tool install poethepoet

      - name: Run the dependency audit (the audit-deps gate command)
        # The exact poe audit-deps command from pyproject.toml (uv
        # audit --locked over the committed uv.lock; ignores in
        # uv.toml stay in force). Nonzero exit = advisories in the
        # locked set or an audit error; the captured output says
        # which. The step itself stays green either way — skip-honest
        # reporting, the triage issue carries the verdict.
        run: |
          set +e
          poe audit-deps > audit-output.txt 2>&1
          echo "$?" > audit-exit.txt
          exit 0

      - name: Read the open CodeQL alerts
        # Read-only collection of the alerts codeql.yml produced. If
        # the API call fails (no code scanning on a fork, missing
        # scope), the failure is recorded as a limitation for the
        # report instead of reding the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100" \
            > codeql-alerts.json 2> codeql-error.txt
          echo "$?" > codeql-exit.txt
          exit 0

      - name: Build the triage report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$RUN_URL" > run-url.txt
          printf '%s\n' "$REF_NAME" > ref-name.txt
          printf '%s\n' "$SHA" > sha.txt
          python3 scripts/security_triage_report.py . triage-body.md
          cat triage-summary.txt

      - name: Append to the open triage issue, or file one on findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create security-triage --color D93F0B \
            --description "Findings from the weekly security sweep (bot)" \
            > /dev/null 2>&1 || true
          open_issue=$(gh issue list --label security-triage --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file triage-body.md
            echo "Report appended to the open triage issue #$open_issue"
            exit 0
          fi
          # No open issue: file a new one only when the sweep has
          # something to say (advisories, alerts, or a scanner gap).
          if grep -q "has_report=yes" triage-summary.txt; then
            gh issue create \
              --title "Weekly security triage report" \
              --body-file triage-body.md \
              --label "security-triage" \
              --label "dept:engineering"
            echo "Filed a new triage issue"
          else
            echo "Clean sweep and no open triage issue; nothing filed"
          fi

      - name: Batch the week's report into one auto-PR (open or update)
        # Owner override 2026-11-27 (#513/#512): report batching only —
        # still no auto-fixes. One fixed chore/ branch, one PR, and the
        # body is the human triage surface. Write failures stay green:
        # the report already rode the weekly triage issue.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="chore/security-triage-report"
          DOC_DIR="docs/security/triage"
          REPORT_DATE="$(date -u +%Y-%m-%d)"
          REPORT_PATH="${DOC_DIR}/${REPORT_DATE}.md"

          has_report=no
          if grep -q "has_report=yes" triage-summary.txt; then
            has_report=yes
          fi

          open_pr="$(gh pr list --head "${BRANCH}" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"

          # Skip-honest: a clean run with no open report PR stays silent.
          if [[ -z "${open_pr}" && "${has_report}" == "no" ]]; then
            echo "Clean sweep and no open report PR; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The PR body is the human triage surface: a short preamble,
          # then the full run report.
          mkdir -p /tmp/triage-pr
          {
            cat <<'HEAD'
          ## Automated security triage PR (bot)

          This pull request batches the week's security findings report. It
          carries the report file only. It never fixes code. A person reads the
          report and decides: merge the record, or close the PR.

          The body below holds the latest run's report. Earlier runs' reports
          stay in the dated files on this branch and in the triage issue.

          The checks run natively on this pull request. The RELEASE_PAT token
          created it, the same token approach changelog.yml uses. GitHub starts
          workflow runs for events made with the token.
          HEAD
            cat triage-body.md
          } > /tmp/triage-pr/body.md

          pr_reason=""
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            # Update path: stack the dated report file on the branch tip
            # through a throwaway worktree, then push (fast-forward).
            if ! git fetch --depth=1 origin "${BRANCH}"; then
              pr_reason="branch fetch failed"
            else
              branch_sha="$(git rev-parse FETCH_HEAD)"
              rm -rf /tmp/triage-tw
              if ! git worktree add /tmp/triage-tw "${branch_sha}"; then
                pr_reason="worktree setup failed"
              else
                mkdir -p "/tmp/triage-tw/${DOC_DIR}"
                cp triage-body.md "/tmp/triage-tw/${REPORT_PATH}"
                git -C /tmp/triage-tw add "${REPORT_PATH}"
                if ! git -C /tmp/triage-tw diff --cached --quiet; then
                  git -C /tmp/triage-tw commit -m "chore(triage): Weekly security triage report for ${REPORT_DATE}"
                fi
                if ! git -C /tmp/triage-tw push origin "HEAD:refs/heads/${BRANCH}"; then
                  pr_reason="branch push failed"
                fi
                git worktree remove /tmp/triage-tw || true
                rm -rf /tmp/triage-tw || true
              fi
            fi
          else
            # Create path: fresh branch off the checked-out tip. A run
            # only reaches this path with findings, so the PR opens too.
            git checkout -b "${BRANCH}"
            mkdir -p "${DOC_DIR}"
            cp triage-body.md "${REPORT_PATH}"
            if git diff --cached --quiet; then
              echo "The ${REPORT_DATE} report file is already on the base branch; nothing to file"
              exit 0
            fi
            git commit -m "chore(triage): Weekly security triage report for ${REPORT_DATE}"
            if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
              pr_reason="branch push failed"
            fi
          fi

          if [[ -n "${pr_reason}" ]]; then
            echo "Report PR write failed: ${pr_reason}. The report still rode the weekly triage issue."
            exit 0
          fi

          if [[ -z "${open_pr}" ]]; then
            gh pr create --base develop --head "${BRANCH}" \
              --title "docs(triage): Batch the weekly security findings report" \
              --body-file /tmp/triage-pr/body.md \
              --label "security-triage" \
              || echo "Pull request creation failed; the report still rode the weekly triage issue."
          else
            gh pr edit "${open_pr}" --body-file /tmp/triage-pr/body.md \
              || echo "Pull request update failed; the report still rode the weekly triage issue."
          fi
          echo "Report PR batched on ${BRANCH} at ${REPORT_PATH}"
