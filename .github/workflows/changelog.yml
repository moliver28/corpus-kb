# Regenerate CHANGELOG.md from Conventional Commit history.
#
# Runs Commitizen's `cz changelog` command whenever a GitHub release is
# published. The command consumes the commit range from the most recent
# vX.Y.Z tag (inclusive) up to the current release tag and appends the
# rendered Markdown to CHANGELOG.md. The commit is then pushed back to
# the default branch so the next PyPI release ships with an up-to-date
# changelog visible at the repo root.
#
# Why not run on push-to-master? Generating a changelog requires a
# release tag as the upper bound. Running on `release: published` keeps
# the changelog tightly coupled to the artefact that PyPI is about to
# receive.
#
# Configuration lives in [tool.commitizen] in pyproject.toml. The
# custom commit schema intentionally mirrors the regex enforced by
# .github/workflows/commit-validate.yml so the two validators never
# disagree about what counts as a release commit.

name: Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate-changelog:
    name: Regenerate CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Commitizen
        run: python -m pip install --upgrade pip "commitizen>=4.0"

      - name: Determine previous tag
        id: prev-tag
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "${PREV_TAG}" ]]; then
            echo "prev-tag=${PREV_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "prev-tag=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Regenerate CHANGELOG.md
        env:
          PREV_TAG: ${{ steps.prev-tag.outputs.prev-tag }}
          NEW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${PREV_TAG}" ]]; then
            cz changelog "${PREV_TAG}..${NEW_TAG}" --incremental
          else
            cz changelog --incremental --unreleased-version "${NEW_TAG}"
          fi

      - name: Commit updated CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog updates to commit"
            exit 0
          fi
          git commit -m "chore(release): regenerate CHANGELOG.md for ${GITHUB_REF_NAME}"
          git push