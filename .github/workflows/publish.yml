# Manual TestPyPI publish pipeline for Corpus-KB (PyPI Trusted Publishing, OIDC).
# No long-lived PyPI API token is stored in GitHub.
#
# Trigger:
#   - workflow_dispatch -> TestPyPI (manual dry-run publish of the selected ref)
#
# Real publishes are owned by release.yml (GitHub release events: prerelease
# -> TestPyPI, final -> PyPI). This workflow deliberately has NO tag/release
# trigger: overlapping triggers would race release.yml on the same upload
# and one run would always fail on PyPI's "file already exists".
#
# ONE-TIME manual setup, before the first run of this workflow:
#
#   1. Repo environments (Settings -> Environments): `testpypi` must exist
#      (release.yml documents it as created 2026-10-08 via API; create it if
#      missing). No protection rules are required for TestPyPI.
#
#   2. Register a pending trusted publisher for THIS workflow on TestPyPI:
#      - https://test.pypi.org/manage/account/publishing/  (project: corpus-kb)
#      Pending publisher settings:
#      - Owner (PyPI project): existing or new project name "corpus-kb"
#      - Owner (GitHub): moliver28
#      - Repository: corpus-kb
#      - Workflow name: publish.yml
#      - Environment: testpypi
#      release.yml has its own pending-publisher entries (workflow name
#      release.yml, environments testpypi/pypi); the workflows are
#      registered separately.

name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-testpypi:
    name: Publish to TestPyPI (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: false
