name: Validate Branch Naming

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-branch:
    name: Validate Branch Naming
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name (GitFlow)
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          # Integration branches carry GitFlow merge PRs between protected
          # branches (develop to master, master to production). Their head
          # refs are bare names, not prefixed slugs.
          if [[ "$BRANCH_NAME" =~ ^(develop|master|production)$ ]]; then
            echo "PASS: Branch name '$BRANCH_NAME' is an integration branch"
            exit 0
          fi
          # renovate/* branches come from the Renovate dependency bot (.github/renovate.jsonc);
          # their slugs contain dots and nested slashes, so prefix-match them separately.
          if [[ ! $BRANCH_NAME =~ ^([Ff]eature|[Bb]ugfix|[Hh]otfix|[Dd]ocs|[Cc]hore|[Rr]elease)/[-a-zA-Z0-9]+$ ]] && [[ ! $BRANCH_NAME =~ ^renovate/ ]]; then
            echo "FAIL: Branch name '$BRANCH_NAME' does not match GitFlow pattern"
            echo "   Expected: feature/*, bugfix/*, hotfix/*, docs/*, chore/*, release/*, renovate/*, or a bare integration branch (develop, master, production)"
            exit 1
          fi
          echo "PASS: Branch name '$BRANCH_NAME' is valid"
